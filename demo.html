/* Un passage reste corrigible quelques heures après le scan. */
const CORRECTION_WINDOW_H = 12;
const myRecentScans = () => allTxs(STATE.shopId)
  .filter(t => (t.type === 'earn' || t.type === 'redeem') && t.employee === me().name
            && (Date.now() - t.date) < CORRECTION_WINDOW_H * 3600000)
  .sort((a, b) => b.date - a.date);

function renderCounter() {
  /* En desktop, le comptoir n'existe pas : on explique où il se trouve. */
  if (isDesktop()) {
    $('#view').innerHTML = `
      <div class="counter-away">
        <div class="counter-away__qr">${qrHtml(7)}</div>
        <h1>Le comptoir se tient depuis un téléphone ou une tablette</h1>
        <p>Scanner une carte, créditer un passage ou corriger une erreur se fait en caisse,
           sur un écran de moins de 1024 px de large. Sur ordinateur, cet écran n’est pas affiché.</p>
        <p class="counter-away__who">
          <span class="avatar avatar--sm" aria-hidden="true">${initials(me().name)}</span>
          ${esc(me().name)} · ${roleOf(me()).label} · ${esc(shopLabel())}
        </p>
      </div>`;
    icons();
    return;
  }

  const scans = myRecentScans();

  $('#view').innerHTML = `
    <div class="view__head">
      <div>
        <h1>Comptoir</h1>
        <p>${esc(me().name)} · ${roleOf(me()).label} · ${esc(shopLabel())}</p>
      </div>
    </div>

    <button class="btn btn--primary btn--lg btn--block" id="openScan" style="height:56px;font-size:17px;margin-bottom:16px">
      <i data-lucide="scan-line"></i> Scanner une carte
    </button>

    <div class="grid">
      <div class="card">
        <div class="card__head">
          <h3>Mes derniers passages</h3>
          <span class="pill">${num(scans.length)} sur ${CORRECTION_WINDOW_H} h</span>
        </div>
        <div class="list">
          ${scans.length ? scans.slice(0, 8).map(t => `
            <div class="list__row">
              <span class="avatar avatar--sm avatar--gray" aria-hidden="true">${initials(t.client.name)}</span>
              <span class="list__txt">
                <b>${esc(t.client.name)}</b>
                <span>${timeFmt.format(t.date)} · ${dayFmt.format(t.date)}${t.amount ? ' · ' + money(t.amount) : ''}</span>
              </span>
              <span class="pill ${t.type === 'redeem' ? '' : 'pill--yellow'}">
                ${t.type === 'redeem' ? 'Récompense' : '+ ' + (shopById(t.client.shopId).program.type === 'stamps' ? '1 tampon' : num(t.qty) + ' pts')}
              </span>
              ${can('scan.correct') && t.type === 'earn'
                ? `<button class="icon-btn icon-btn--plain" data-undo="${t.client.id}|${t.date.getTime()}" aria-label="Corriger ce passage" title="Corriger ce passage"><i data-lucide="rotate-ccw"></i></button>`
                : ''}
            </div>`).join('')
            : `<p class="empty"><i data-lucide="scan-line"></i>Aucun passage enregistré par vous sur les ${CORRECTION_WINDOW_H} dernières heures.</p>`}
        </div>
      </div>
    </div>`;

  $('#openScan')?.addEventListener('click', openScanner);
  $$('[data-undo]').forEach(b => b.addEventListener('click', () => {
    const [cid, ts] = b.dataset.undo.split('|');
    confirmUndo(CLIENTS.find(c => c.id === cid), +ts);
  }));
}

/* Correction d'un scan : le solde revient à son état d'avant, et la
   correction reste tracée dans l'historique du client. */
function confirmUndo(client, ts) {
  if (!client || !can('scan.correct')) return;
  const tx = client.txs.find(t => t.date.getTime() === ts && t.type === 'earn');
  if (!tx) return;
  const prog = shopById(client.shopId).program;
  const unit = prog.type === 'stamps' ? `${tx.qty} tampon` : `${num(tx.qty)} ${prog.unit}`;

  openModal(`
    <h2>Corriger ce passage ?</h2>
    <p class="modal__lead">
      ${esc(client.name)} · ${timeFmt.format(tx.date)}<br>
      <b>${unit}</b> seront retirés de son solde, qui repassera à
      <b>${prog.type === 'stamps' ? Math.max(0, client.balance - tx.qty) + ' / ' + prog.cells : num(Math.max(0, client.balance - tx.qty)) + ' ' + prog.unit}</b>.
    </p>
    <div class="field">
      <label for="undoReason">Motif de la correction</label>
      <select class="select" id="undoReason">
        <option>Scan en double</option>
        <option>Mauvais client scanné</option>
        <option>Montant saisi erroné</option>
        <option>Achat annulé</option>
      </select>
    </div>
    <div class="modal__foot">
      <button class="btn btn--secondary" data-close>Annuler</button>
      <button class="btn btn--danger" id="undoGo">Corriger</button>
    </div>`);

  $('#undoGo').addEventListener('click', () => {
    const reason = $('#undoReason').value;
    client.balance = Math.max(0, client.balance - tx.qty);
    client.txs = client.txs.filter(t => t !== tx);
    client.txs.unshift({
      date: new Date(), type: 'correct', qty: -tx.qty,
      label: reason, employee: me().name
    });
    /* La récompense débloquée par ce passage tombe avec lui. */
    if (prog.type === 'stamps' && client.balance < prog.cells) client.available = null;
    if (prog.type === 'points' && !prog.rewards.some(r => r.cost <= client.balance)) client.available = null;
    closeModal();
    render();
    toast(`Passage corrigé · ${reason.toLowerCase()}`, 'rotate-ccw');
  });
  $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
}

              </tr>`).join('')}
          </tbody>
        </table>

    </div>

    <div class="cards-list">

        <button class="client-card" data-member="${m.id}">

/* Fiche d'un membre : rôle, périmètre, puis droit par droit. */
function openMember(id) {
  const m = memberById(id);
  if (!m) return;
  const editable = can('team.manage');
  const r = roleOf(m);

  openPanel(m.name, `
    <div style="display:flex;align-items:center;gap:13px;margin-bottom:18px">
      <span class="avatar avatar--lg ${m.active ? '' : 'avatar--gray'}" aria-hidden="true">${initials(m.name)}</span>
      <div>
        <div style="font-size:18px;font-weight:700;letter-spacing:-.02em">${esc(m.name)}</div>
        <div style="font-size:13px;color:var(--ink-2)">${esc(m.phone)}</div>
        <div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">
          ${roleBadge(m)}
          <span class="pill ${m.active ? 'pill--ok' : 'pill--err'}">${m.active ? 'Accès actif' : 'Accès révoqué'}</span>
        </div>
      </div>
    </div>

    <p class="section-label">Rôle</p>
    <div class="radio-list">
      ${Object.values(ROLES).map(role => `
        <button class="radio-opt ${m.role === role.id ? 'is-sel' : ''}" data-role="${role.id}" ${editable ? '' : 'disabled'}>
          <span class="radio-opt__mark" aria-hidden="true"></span>
          <span class="radio-opt__txt"><b>${role.label}</b><span>${role.desc}</span></span>
        </button>`).join('')}
    </div>

    <p class="section-label">Établissements</p>
    ${r.allShops
      ? `<p class="field__hint"><i data-lucide="globe" style="width:13px;height:13px;vertical-align:-2px"></i>
         Un super gérant accède à tous les établissements du compte, présents et à venir.</p>`
      : `<div class="check-list">
          ${SHOPS.map(s => `
            <label class="check-row">
              <input type="checkbox" data-shop="${s.id}" ${m.shops.includes(s.id) ? 'checked' : ''} ${editable ? '' : 'disabled'}>
              <span class="shop-logo shop-logo--sm" style="background:${s.color}" aria-hidden="true">${s.letter}</span>
              <span class="check-row__txt"><b>${esc(s.name)}</b><span>${esc(s.city)} · ${num(activeCardsOf(s.id))} clients</span></span>
            </label>`).join('')}
        </div>`}

    <p class="section-label">Ce que ce rôle autorise</p>
    <p class="field__hint" style="margin-bottom:12px">
      Les droits se règlent par rôle, pas membre par membre.
      ${editable ? 'Pour les modifier, allez dans Paramètres → Gestion des rôles.' : ''}
    </p>
    <ul class="cap-summary">
      ${CAPS.map(c => {
        const on = r.caps.includes(c.id);
        return `<li class="${on ? '' : 'is-off'}">
          <i data-lucide="${on ? 'check' : 'minus'}" aria-hidden="true"></i>${c.label}
        </li>`;
      }).join('')}
    </ul>
    ${editable ? '<button class="btn btn--secondary btn--block" id="mRoles" style="margin-top:16px"><i data-lucide="settings"></i> Modifier les droits des rôles</button>' : ''}
  `, editable ? `
    ${m.id === STATE.userId
      ? '<button class="btn btn--secondary" disabled title="Vous ne pouvez pas révoquer votre propre accès"><i data-lucide="ban"></i> Révoquer</button>'
      : `<button class="btn ${m.active ? 'btn--danger' : 'btn--primary'}" id="mToggle">
           <i data-lucide="${m.active ? 'ban' : 'check'}"></i> ${m.active ? 'Révoquer l’accès' : 'Rétablir l’accès'}
         </button>`}
  ` : '');

  if (!editable) return;

  $$('[data-role]').forEach(b => b.addEventListener('click', () => {
    const next = b.dataset.role;
    if (m.id === STATE.userId && next !== 'super') {
      return toast('Vous ne pouvez pas retirer votre propre rôle de super gérant', 'alert-circle');
    }
    m.role = next;
    if (ROLES[next].allShops) m.shops = SHOPS.map(s => s.id);
    else if (!m.shops.length) m.shops = [currentShop()?.id || SHOPS[0].id];
    openMember(m.id);
    render();
    toast(`${m.name} est maintenant ${ROLES[next].label.toLowerCase()}`, ROLES[next].icon);
  }));

  $$('[data-shop]').forEach(cb => cb.addEventListener('change', () => {
    const id = cb.dataset.shop;
    m.shops = cb.checked ? [...new Set([...m.shops, id])] : m.shops.filter(x => x !== id);
    if (!m.shops.length) {
      m.shops = [id];
      cb.checked = true;
      return toast('Un membre doit être rattaché à au moins un établissement', 'alert-circle');
    }
    if (m.id === STATE.userId) { clampShop(); syncShopButtons(); }
    render();
  }));

  $('#mRoles')?.addEventListener('click', () => { closePanel(); go('parametres'); });

  $('#mToggle')?.addEventListener('click', () => {
    m.active = !m.active;
    closePanel();
    render();
    toast(m.active ? `Accès de ${m.name} rétabli` : `Accès de ${m.name} révoqué`, m.active ? 'check' : 'ban');
  });
}

/* Les droits d'un rôle : une case cochée ici vaut pour tous ses membres. */
function renderRoleCaps() {
  const key = SETTINGS.roleTab;

  $('#roleCaps').innerHTML = `

      </div>
      <span class="pill">${holders.length} membre${holders.length > 1 ? 's' : ''}</span>
    </div>

    ${isSuper ? `
      <p class="field__hint" style="margin:14px 0 0">
        <i data-lucide="lock" style="width:13px;height:13px;vertical-align:-2px"></i>
        Le super gérant conserve tous les droits : c’est ce qui garantit qu’on ne peut pas
        se verrouiller hors de son propre compte.
      </p>` : ''}

    ${CAP_GROUPS.map(g => `
      <div class="cap-group" style="margin-top:18px">
        <p class="cap-group__title">${g}</p>
        ${CAPS.filter(c => c.group === g).map(c => {

          const reserved = c.superOnly && !isSuper;
          return `<div class="cap-row ${reserved ? 'is-locked' : ''}">
            <span class="cap-row__txt">
              <b>${c.label}</b>
              <span>${c.desc}</span>
              ${reserved
                ? '<span class="pill" style="margin-top:5px"><i data-lucide="lock"></i>Réservé au super gérant</span>' : ''}
            </span>
            <button class="switch" role="switch" data-rolecap="${c.id}"
                    aria-checked="${on}" aria-label="${c.label}" ${isSuper || reserved ? 'disabled' : ''}></button>
          </div>`;
        }).join('')}
      </div>`).join('')}

    ${isSuper ? '' : `
      <button class="btn btn--secondary" id="roleReset" style="margin-top:16px">
        <i data-lucide="rotate-ccw"></i> Rétablir les droits d’origine
      </button>`}`;

  $$('[data-rolecap]').forEach(sw => sw.addEventListener('click', () => {
    const id = sw.dataset.rolecap;
    if (SUPER_ONLY.includes(id)) return toast(`${capById(id).label} : réservé au super gérant`, 'lock');
    const grant = !role.caps.includes(id);
    role.caps = grant ? [...role.caps, id] : role.caps.filter(c => c !== id);
    normalizeRole(key);
    applyRoleChange(key, `${capById(id).label} · ${grant ? 'accordé' : 'retiré'}`);
  }));

  $('#roleReset')?.addEventListener('click', () => {
    role.caps = [...DEFAULT_ROLE_CAPS[key]];
    normalizeRole(key);
    applyRoleChange(key, `Droits du rôle ${role.label.toLowerCase()} rétablis`);
  });

  icons();
}

/* ============================================================
   5.1 Tableau de bord
   ============================================================ */
function allTxs(shopId) {
  const out = [];
  for (const c of clientsOf(shopId)) for (const t of c.txs) out.push({ ...t, client: c });
  return out;
}

/* Variation entre les 30 derniers jours et les 30 précédents. */
function delta(curr, prev) {
  if (!prev) return curr ? 100 : 0;
  return Math.round((curr - prev) / prev * 100);
}

function dashboardMetrics(shopId) {
  const clients = clientsOf(shopId);
  const txs = allTxs(shopId);
  const inWindow = (d, from, to) => { const a = daysAgo(d); return a >= from && a < to; };

  const signupsNow  = clients.filter(c => daysAgo(c.joined) < 30).length;
  const signupsPrev = clients.filter(c => inWindow(c.joined, 30, 60)).length;

  const visitsNow  = txs.filter(t => t.type === 'earn' && daysAgo(t.date) < 30).length;
  const visitsPrev = txs.filter(t => t.type === 'earn' && inWindow(t.date, 30, 60)).length;

  const rewardsNow  = txs.filter(t => t.type === 'redeem' && daysAgo(t.date) < 30).length;
  const rewardsPrev = txs.filter(t => t.type === 'redeem' && inWindow(t.date, 30, 60)).length;

  const eligibleNow = clients.filter(c => daysAgo(c.joined) >= 30);
  const returnNow = eligibleNow.length
    ? Math.round(eligibleNow.filter(c => daysAgo(c.lastVisit) <= 30).length / eligibleNow.length * 100) : 0;
  const eligiblePrev = clients.filter(c => daysAgo(c.joined) >= 60);
  const returnPrev = eligiblePrev.length
    ? Math.round(eligiblePrev.filter(c => c.txs.some(t => t.type === 'earn' && inWindow(t.date, 30, 60))).length / eligiblePrev.length * 100) : 0;

  return {
    clients: clients.length,
    signupsNow, signupsPrev,
    visitsNow, visitsPrev,
    rewardsNow, rewardsPrev,
    returnNow, returnPrev
  };
}

function visitsSeries(shopId, days) {
  const txs = allTxs(shopId).filter(t => t.type === 'earn');
  const labels = [], data = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * DAY);
    labels.push(dayFmt.format(d));
    data.push(txs.filter(t => daysAgo(t.date) === i).length);
  }
  return { labels, data };
}

function supportSplit(shopId) {
  const list = clientsOf(shopId);
  return SUPPORTS.map(s => ({
    ...s,
    count: list.filter(c => c.support === s.id).length
  }));
}

function kpiHtml(icon, label, value, d, suffix = '') {
  const up = d >= 0;
  return `
    <div class="kpi">
      <div class="kpi__top">
        <span class="kpi__ico"><i data-lucide="${icon}" aria-hidden="true"></i></span>
        <span>${label}</span>
      </div>
      <div class="kpi__val">${value}${suffix}</div>
      <div class="kpi__delta ${up ? 'up' : 'down'}">
        <i data-lucide="${up ? 'trending-up' : 'trending-down'}" aria-hidden="true"></i>
        ${up ? '+' : ''}${d} % <small>sur 30 jours</small>
      </div>
    </div>`;
}

function drawVisitsChart() {
  const { labels, data } = visitsSeries(STATE.shopId, STATE.chartRange);
  if (visitsChart) visitsChart.destroy();
  if (!window.Chart) return;
  const ctx = $('#visitsChart');
  if (!ctx) return;
  const grad = ctx.getContext('2d').createLinearGradient(0, 0, 0, 240);
  grad.addColorStop(0, 'rgba(255,247,92,.65)');
  grad.addColorStop(1, 'rgba(255,247,92,0)');
  visitsChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{
      data, borderColor: '#1D1D1F', borderWidth: 2, backgroundColor: grad, fill: true,
      tension: .35, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: '#1D1D1F'
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#1D1D1F', padding: 10, displayColors: false,
          callbacks: { label: c => `${c.parsed.y} passage${c.parsed.y > 1 ? 's' : ''}` } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 7, color: '#6E6E73', font: { size: 11 } } },
        y: { beginAtZero: true, grid: { color: '#E5E5EA' }, border: { display: false },
             ticks: { precision: 0, color: '#6E6E73', font: { size: 11 } } }
      }
    }
  });
}

/* Suggestions calculées sur les données réelles de la démo. */
function aiSuggestions(shopId) {
  const list = clientsOf(shopId);
  const near = list.filter(c => { const p = progressOf(c); return p.target && p.target - p.current <= (shopById(c.shopId).program.type === 'stamps' ? 1 : 150); });
  const inactive = list.filter(c => daysAgo(c.lastVisit) > 45);
  const unused = list.filter(c => c.available);

  return [
    { icon: 'target',
      title: `${num(near.length)} clients sont à un cheveu de leur récompense`,
      desc: 'Un rappel suffirait à déclencher le passage suivant.',
      action: 'Envoyer',
      campaign: { title: 'Vous y êtes presque', body: 'Il ne vous manque presque rien pour débloquer votre récompense. À très vite !', audience: 'near' } },
    { icon: 'user-minus',
      title: `${num(inactive.length)} clients absents depuis plus de 45 jours`,
      desc: 'Une relance avec un avantage ramène en moyenne un client sur cinq.',
      action: 'Relancer',
      campaign: { title: 'Vous nous manquez', body: 'Votre carte est toujours active, avec vos points déjà acquis. Passez quand vous voulez.', audience: 'inactive' } },
    { icon: 'gift',
      title: `${num(unused.length)} récompenses débloquées ne sont pas utilisées`,
      desc: 'Ces clients ont une bonne raison de revenir, rappelez-la-leur.',
      action: 'Rappeler',
      campaign: { title: 'Votre récompense vous attend', body: 'Elle est déjà débloquée sur votre carte : pensez à en profiter lors de votre prochaine visite.', audience: 'near' } }
  ];
}

const PAGE_SIZE = 20;

const COLUMNS = [
  { key: 'name',      label: 'Client' },
  { key: 'phone',     label: 'Téléphone' },
  { key: 'type',      label: 'Type' },
  { key: 'support',   label: 'Support' },
  { key: 'balance',   label: 'Solde' },
  { key: 'lastVisit', label: 'Dernier passage' },
  { key: 'joined',    label: 'Inscription' },
  { key: 'status',    label: 'Statut' }
];

function clientValue(c, key) {
  const prog = shopById(c.shopId).program;
  switch (key) {
    case 'name':      return c.name;
    case 'phone':     return c.phone;
    case 'type':      return prog.type === 'stamps' ? 'Tampons' : 'Points';
    case 'support':   return SUPPORTS.find(s => s.id === c.support).label;
    case 'balance':   return c.balance;
    case 'lastVisit': return c.lastVisit.getTime();
    case 'joined':    return c.joined.getTime();
    case 'status':    return statusOf(c).label;
    case 'shop':      return shopById(c.shopId).name;
  }
}

function filteredClients() {
  const f = CLIENT_FILTERS;
  const q = f.q.trim().toLowerCase();
  let list = clientsOf(STATE.shopId).filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !c.phone.replace(/\s/g, '').includes(q.replace(/\s/g, ''))) return false;
    if (f.type && shopById(c.shopId).program.type !== f.type) return false;
    if (f.support && c.support !== f.support) return false;
    if (f.status && statusOf(c).key !== f.status) return false;
    if (f.period && daysAgo(c.joined) > +f.period) return false;
    return true;
  });
  list.sort((a, b) => {
    const va = clientValue(a, f.sort), vb = clientValue(b, f.sort);
    if (va === vb) return 0;
    return (va > vb ? 1 : -1) * f.dir;
  });
  return list;
}

/* Icône seule dans le tableau : le libellé tiendrait mal sur huit
   colonnes. Le nom reste accessible via title et le texte masqué. */
function supportCell(c) {
  const s = SUPPORTS.find(x => x.id === c.support);
  return `<span class="support-ico" title="${s.label}"><i data-lucide="${s.icon}" aria-hidden="true"></i><span class="sr-only">${s.label}</span></span>`;
}

function balanceLabel(c) {
  const prog = shopById(c.shopId).program;
  return prog.type === 'stamps' ? `${c.balance} / ${prog.cells}` : `${num(c.balance)} ${prog.unit}`;
}

function renderClients() {
  const f = CLIENT_FILTERS;
  const all = filteredClients();
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  if (f.page > pages) f.page = pages;
  const rows = all.slice((f.page - 1) * PAGE_SIZE, f.page * PAGE_SIZE);
  const showShop = STATE.shopId === 'all';

  $('#view').innerHTML = `
    <div class="view__head">
      <div>
        <h1>Clients</h1>
        <p>${num(all.length)} carte${all.length > 1 ? 's' : ''} sur ${num(clientsOf(STATE.shopId).length)} · ${esc(shopLabel())}</p>
      </div>
      <div class="view__actions">
        ${can('clients.export') ? '<button class="btn btn--secondary" id="csvBtn"><i data-lucide="download"></i> Exporter en CSV</button>' : ''}
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <i data-lucide="search" aria-hidden="true"></i>
        <input class="input" id="cq" type="search" placeholder="Rechercher par nom ou téléphone" value="${esc(f.q)}" aria-label="Rechercher un client">
      </div>
      <select class="select" id="cType" aria-label="Type de carte">
        <option value="">Tous les types</option>
        <option value="stamps"${f.type === 'stamps' ? ' selected' : ''}>Tampons</option>
        <option value="points"${f.type === 'points' ? ' selected' : ''}>Points</option>
      </select>
      <select class="select" id="cSupport" aria-label="Support">
        <option value="">Tous les supports</option>
        ${SUPPORTS.map(s => `<option value="${s.id}"${f.support === s.id ? ' selected' : ''}>${s.label}</option>`).join('')}
      </select>
      <select class="select" id="cStatus" aria-label="Statut">
        <option value="">Tous les statuts</option>
        <option value="active"${f.status === 'active' ? ' selected' : ''}>Actif</option>
        <option value="inactive"${f.status === 'inactive' ? ' selected' : ''}>Inactif</option>
        <option value="reward"${f.status === 'reward' ? ' selected' : ''}>Récompense disponible</option>
      </select>
      <select class="select" id="cPeriod" aria-label="Période d'inscription">
        <option value="">Depuis toujours</option>
        <option value="7"${f.period === '7' ? ' selected' : ''}>Inscrits sur 7 jours</option>
        <option value="30"${f.period === '30' ? ' selected' : ''}>Inscrits sur 30 jours</option>
        <option value="90"${f.period === '90' ? ' selected' : ''}>Inscrits sur 90 jours</option>
      </select>
      ${(f.q || f.type || f.support || f.status || f.period)
        ? '<button class="btn btn--ghost" id="cReset"><i data-lucide="x"></i> Réinitialiser</button>' : ''}
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr>
            ${showShop ? '<th>Établissement</th>' : ''}
            ${COLUMNS.map(col => `
              <th><button data-sort="${col.key}" class="${f.sort === col.key ? 'is-sorted' : ''}">
                ${col.label}<i data-lucide="${f.sort === col.key ? (f.dir === 1 ? 'arrow-up' : 'arrow-down') : 'chevrons-up-down'}"></i>
              </button></th>`).join('')}
          </tr></thead>
          <tbody>
            ${rows.map(c => {
              const st = statusOf(c);
              return `<tr tabindex="0" data-client="${c.id}">
                ${showShop ? `<td><span class="pill"><span class="legend__dot" style="background:${shopById(c.shopId).color}"></span>${esc(shopById(c.shopId).name)}</span></td>` : ''}
                <td><span class="who"><span class="avatar avatar--sm avatar--gray" aria-hidden="true">${initials(c.name)}</span><b>${esc(c.name)}</b></span></td>
                <td>${esc(c.phone)}</td>
                <td>${shopById(c.shopId).program.type === 'stamps' ? 'Tampons' : 'Points'}</td>
                <td>${supportCell(c)}</td>
                <td><b>${balanceLabel(c)}</b></td>
                <td>${shortFmt.format(c.lastVisit)}</td>
                <td>${shortFmt.format(c.joined)}</td>
                <td><span class="pill ${st.cls}">${st.label}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        ${rows.length ? '' : '<p class="empty"><i data-lucide="users"></i>Aucun client ne correspond à ces filtres.</p>'}
      </div>
      <div class="pager">
        <span>Page ${f.page} sur ${pages} · ${num(all.length)} client${all.length > 1 ? 's' : ''}</span>
        <span class="pager__btns">
          <button class="icon-btn" id="prevPage" aria-label="Page précédente" ${f.page === 1 ? 'disabled' : ''}><i data-lucide="chevron-left"></i></button>
          <button class="icon-btn" id="nextPage" aria-label="Page suivante" ${f.page === pages ? 'disabled' : ''}><i data-lucide="chevron-right"></i></button>
        </span>
      </div>
    </div>

    <div class="cards-list">
      ${rows.map(c => {
        const st = statusOf(c);
        return `<button class="client-card" data-client="${c.id}">
          <span class="avatar avatar--gray" aria-hidden="true">${initials(c.name)}</span>
          <span class="client-card__txt">
            <b>${esc(c.name)}</b>
            <span>${esc(c.phone)}</span>
            <span class="client-card__meta">
              <span class="pill"><i data-lucide="${SUPPORTS.find(s => s.id === c.support).icon}"></i>${balanceLabel(c)}</span>
              <span class="pill ${st.cls}">${st.label}</span>
              ${showShop ? `<span class="pill">${esc(shopById(c.shopId).name)}</span>` : ''}
            </span>
          </span>
          <i data-lucide="chevron-right" aria-hidden="true" style="width:18px;height:18px;color:var(--ink-2)"></i>
        </button>`;
      }).join('')}
      ${rows.length ? `<div class="pager" style="border:none">
        <span>Page ${f.page} sur ${pages}</span>
        <span class="pager__btns">
          <button class="icon-btn" id="prevPageM" aria-label="Page précédente" ${f.page === 1 ? 'disabled' : ''}><i data-lucide="chevron-left"></i></button>
          <button class="icon-btn" id="nextPageM" aria-label="Page suivante" ${f.page === pages ? 'disabled' : ''}><i data-lucide="chevron-right"></i></button>
        </span></div>` : '<p class="empty"><i data-lucide="users"></i>Aucun client ne correspond à ces filtres.</p>'}
    </div>`;

  /* Filtres */
  const refresh = () => { CLIENT_FILTERS.page = 1; render(); };
  const q = $('#cq');
  q.addEventListener('input', e => {
    f.q = e.target.value;
    clearTimeout(q._t);
    q._t = setTimeout(() => { refresh(); $('#cq').focus(); $('#cq').setSelectionRange(f.q.length, f.q.length); }, 220);
  });
  $('#cType').addEventListener('change', e => { f.type = e.target.value; refresh(); });
  $('#cSupport').addEventListener('change', e => { f.support = e.target.value; refresh(); });
  $('#cStatus').addEventListener('change', e => { f.status = e.target.value; refresh(); });
  $('#cPeriod').addEventListener('change', e => { f.period = e.target.value; refresh(); });
  $('#cReset')?.addEventListener('click', () => {
    Object.assign(f, { q: '', type: '', support: '', status: '', period: '', page: 1 });
    render();
  });

  /* Tri */
  $$('[data-sort]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sort;
    if (f.sort === k) f.dir *= -1; else { f.sort = k; f.dir = 1; }
    render();
  }));

  /* Pagination */
  const goPage = n => { f.page = n; render(); };
  $('#prevPage')?.addEventListener('click', () => goPage(f.page - 1));
  $('#nextPage')?.addEventListener('click', () => goPage(f.page + 1));
  $('#prevPageM')?.addEventListener('click', () => goPage(f.page - 1));
  $('#nextPageM')?.addEventListener('click', () => goPage(f.page + 1));

  /* Fiche client */
  $$('[data-client]').forEach(n => {
    n.addEventListener('click', () => openClient(n.dataset.client));
    n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openClient(n.dataset.client); } });
  });

  $('#csvBtn')?.addEventListener('click', () => exportCsv(all));
}

/* ---------- Export CSV (vrai fichier) ---------- */
function exportCsv(list) {
  const header = ['Nom', 'Téléphone', 'Établissement', 'Ville', 'Type de carte', 'Support',
                  'Solde', 'Consentement marketing', 'Dernier passage', 'Date d’inscription', 'Statut'];
  const cell = v => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [header.map(cell).join(';')];

  for (const c of list) {
    const shop = shopById(c.shopId);
    lines.push([
      c.name, c.phone, shop.name, shop.city,
      shop.program.type === 'stamps' ? 'Tampons' : 'Points',
      SUPPORTS.find(s => s.id === c.support).label,
      balanceLabel(c),
      c.consent ? 'Oui' : 'Non',
      dateFmt.format(c.lastVisit),
      dateFmt.format(c.joined),
      statusOf(c).label
    ].map(cell).join(';'));
  }

  /* BOM UTF-8 : les accents restent lisibles dans Excel. */
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = el('a');
  a.href = url;
  a.download = `clients-${(currentShop()?.name || 'tous-etablissements').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${num(list.length)} clients exportés en CSV`, 'download');
}

/* ---------- Fiche client ---------- */
function openClient(id) {
  const c = CLIENTS.find(x => x.id === id);
  if (!c) return;
  const shop = shopById(c.shopId);
  const prog = shop.program;
  const p = progressOf(c);
  const st = statusOf(c);
  const supp = SUPPORTS.find(s => s.id === c.support);

  const stamps = prog.type === 'stamps' ? `
    <div class="stamp-rail">
      ${Array.from({ length: prog.cells }, (_, i) => {
        const filled = i < c.balance;
        const reward = prog.rewards.find(r => r.cell === i + 1);
        return `<span class="stamp-cell ${filled ? 'is-full' : ''} ${reward ? 'is-reward' : ''}">
          <i data-lucide="${prog.icon}"></i>
          ${reward ? '<span class="stamp-cell__gift"><i data-lucide="gift"></i></span>' : ''}
        </span>`;
      }).join('')}
    </div>` : `
    <div class="progress"><i style="width:${Math.min(100, Math.round(p.current / p.target * 100))}%"></i></div>
    <p class="field__hint">${num(p.current)} / ${num(p.target)} ${prog.unit} vers « ${esc(p.next)} »</p>`;

  openPanel(c.name, `
    <div style="display:flex;align-items:center;gap:13px;margin-bottom:18px">
      <span class="avatar avatar--lg" aria-hidden="true">${initials(c.name)}</span>
      <div>
        <div style="font-size:18px;font-weight:700;letter-spacing:-.02em">${esc(c.name)}</div>
        <div style="font-size:13px;color:var(--ink-2)">${esc(c.phone)}</div>
        <div style="margin-top:7px"><span class="pill ${st.cls}">${st.label}</span></div>
      </div>
    </div>

    ${c.available ? `<div class="reward-banner"><i data-lucide="gift"></i> Récompense disponible : ${esc(c.available)}</div>` : ''}

    <div class="kv">
      <div class="kv__row"><span>Établissement</span><b>${esc(shop.name)}</b></div>
      <div class="kv__row"><span>Programme</span><b>${esc(prog.name)}</b></div>
      <div class="kv__row"><span>Support de carte</span><b>${supp.label}</b></div>
      <div class="kv__row"><span>Consentement marketing</span><b>${c.consent ? 'Accordé' : 'Refusé'}</b></div>
      <div class="kv__row"><span>Inscrit le</span><b>${dateFmt.format(c.joined)}</b></div>
      <div class="kv__row"><span>Dernier passage</span><b>${dateFmt.format(c.lastVisit)} · il y a ${daysAgo(c.lastVisit)} j</b></div>
    </div>

    <p class="section-label">Solde et progression</p>
    <div style="font-size:24px;font-weight:700;letter-spacing:-.02em">${balanceLabel(c)}</div>
    ${stamps}

    <p class="section-label">Historique des transactions</p>
    <div class="timeline">
      ${c.txs.slice(0, 20).map(t => {
        const isRedeem = t.type === 'redeem';
        const isCorrection = t.type === 'correct';
        const LABELS = { welcome: 'Bonus de bienvenue', carry: 'Solde reporté des mois précédents', earn: 'Passage en caisse' };
        const ICONS = { welcome: 'hand-heart', carry: 'history', earn: 'scan-line', correct: 'rotate-ccw' };
        return `<div class="timeline__row">
          <span class="timeline__ico"><i data-lucide="${isRedeem ? 'gift' : ICONS[t.type]}"></i></span>
          <span class="timeline__txt">
            <b>${isRedeem ? esc(t.label) : isCorrection ? 'Correction · ' + esc(t.label) : LABELS[t.type]}</b>
            <span>${dateFmt.format(t.date)} · ${timeFmt.format(t.date)} · ${esc(t.employee)}${t.amount ? ' · ' + money(t.amount) : ''}</span>
          </span>
          <span class="timeline__amt" style="color:${isRedeem || isCorrection ? 'var(--error)' : 'var(--ink)'}">
            ${t.qty > 0 ? '+' : ''}${prog.type === 'stamps' ? t.qty : num(t.qty)}
          </span>
        </div>`;
      }).join('')}
      ${c.txs.length > 20 ? `<p class="field__hint" style="padding:10px 0">… et ${c.txs.length - 20} transactions plus anciennes.</p>` : ''}
    </div>
  `, `
    ${can('clients.edit') ? '<button class="btn btn--secondary" id="pAdjust"><i data-lucide="sliders-horizontal"></i> Ajuster le solde</button>' : ''}
    ${can('campaigns.manage') ? '<button class="btn btn--secondary" id="pMessage"><i data-lucide="send"></i> Envoyer un message</button>' : ''}
    ${can('clients.edit') ? '<button class="btn btn--danger" id="pDisable"><i data-lucide="ban"></i> Désactiver la carte</button>' : ''}
    ${can('clients.edit') || can('campaigns.manage') ? '' :
      '<p class="field__hint"><i data-lucide="lock" style="width:13px;height:13px;vertical-align:-2px"></i> Votre accès est en consultation seule sur cette fiche.</p>'}
  `);

  $('#pAdjust')?.addEventListener('click', () => openAdjust(c));
  $('#pMessage')?.addEventListener('click', () => {
    closePanel();
    go('campagnes');
    openCampaignWizard({ title: 'Un mot pour vous', body: `Bonjour ${c.name.split(' ')[0]}, …`, audience: 'manual' });
  });
  $('#pDisable')?.addEventListener('click', () => {
    openModal(`
      <h2>Désactiver la carte de ${esc(c.name)} ?</h2>
      <p class="modal__lead">La carte disparaît du Wallet du client et ne peut plus être scannée. Son solde est conservé et la carte peut être réactivée.</p>
      <div class="modal__foot">
        <button class="btn btn--secondary" data-close>Annuler</button>
        <button class="btn btn--danger" id="confirmDisable">Désactiver</button>
      </div>`);
    $('#confirmDisable').addEventListener('click', () => {
      closeModal(); closePanel();
      toast(`Carte de ${c.name} désactivée`, 'ban');
    });
    $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  });
}

function openAdjust(c) {
  const prog = shopById(c.shopId).program;
  const unit = prog.type === 'stamps' ? 'tampons' : prog.unit;
  openModal(`
    <h2>Ajuster le solde</h2>
    <p class="modal__lead">${esc(c.name)} · solde actuel : <b>${balanceLabel(c)}</b></p>
    <div class="field">
      <label for="adjVal">Nouveau solde en ${unit}</label>
      <input class="input" id="adjVal" type="number" min="0" ${prog.type === 'stamps' ? `max="${prog.cells}"` : ''} value="${c.balance}">
      <span class="field__hint">L’ajustement est tracé dans l’historique du client.</span>
    </div>
    <div class="field">
      <label for="adjReason">Motif</label>
      <select class="select" id="adjReason">
        <option>Erreur de scan</option>
        <option>Geste commercial</option>
        <option>Report depuis une carte papier</option>
        <option>Autre</option>
      </select>
    </div>
    <div class="modal__foot">
      <button class="btn btn--secondary" data-close>Annuler</button>
      <button class="btn btn--primary" id="confirmAdjust">Enregistrer</button>
    </div>`);
  $('#confirmAdjust').addEventListener('click', () => {
    const v = Math.max(0, +$('#adjVal').value || 0);
    c.balance = v;
    closeModal();
    openClient(c.id);
    toast(`Solde ajusté à ${balanceLabel(c)}`, 'sliders-horizontal');
  });
  $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
}

/* ============================================================
   5.3 Scanner (mobile et tablette uniquement)
   ============================================================ */
const SCAN = { client: null, amount: '', step: 'idle' };
let scanTimer = null;

function openScanner() {
  $('#scanner').classList.add('is-open');
  $('#scannerShop').textContent = currentShop() ? currentShop().name : 'Tous les établissements';
  document.body.style.overflow = 'hidden';
  scanIdle();
}

function closeScanner() {
  clearTimeout(scanTimer);
  $('#scanner').classList.remove('is-open');
  document.body.style.overflow = '';
  SCAN.client = null; SCAN.amount = ''; SCAN.step = 'idle';
}
$('#scannerClose').addEventListener('click', closeScanner);

function syncQueue() {
  const b = $('#scannerQueue');
  b.hidden = STATE.queue === 0;
  b.innerHTML = `<i data-lucide="cloud-off"></i> ${STATE.queue} en attente`;
  b.title = `${STATE.queue} scan${STATE.queue > 1 ? 's' : ''} en attente de synchronisation`;
  icons();
}

function scanFooterHtml() {
  return `
    <div class="scanner__offline">
      <i data-lucide="${STATE.offline ? 'cloud-off' : 'cloud'}" aria-hidden="true"></i>
      <span>Mode hors ligne</span>
      <button class="switch" id="offlineSwitch" role="switch" aria-checked="${STATE.offline}" aria-label="Mode hors ligne"></button>
    </div>
    <button class="scanner__link" id="phoneLookup">Rechercher par téléphone</button>`;
}

function bindScanFooter() {
  $('#offlineSwitch').addEventListener('click', () => {
    STATE.offline = !STATE.offline;
    if (!STATE.offline && STATE.queue) {
      const n = STATE.queue;
      STATE.queue = 0;
      toast(`${n} scan${n > 1 ? 's' : ''} synchronisé${n > 1 ? 's' : ''}`, 'cloud-upload');
    }
    scanIdle();
  });
  $('#phoneLookup').addEventListener('click', () => {
    const pool = clientsOf(STATE.shopId);
    openModal(`
      <h2>Rechercher par téléphone</h2>
      <p class="modal__lead">Solution de secours quand la carte du client ne peut pas être scannée.</p>
      <div class="field">
        <label for="lookupPhone">Numéro du client</label>
        <input class="input" id="lookupPhone" type="tel" inputmode="tel" placeholder="${esc(pool[0] ? pool[0].phone : '+221 77 000 00 00')}">
        <span class="field__hint">Exemple présent dans la démo : ${esc(pool[0] ? pool[0].phone : '—')}</span>
      </div>
      <div class="modal__foot">
        <button class="btn btn--secondary" data-close>Annuler</button>
        <button class="btn btn--primary" id="lookupGo">Rechercher</button>
      </div>`);
    $('#lookupGo').addEventListener('click', () => {
      const v = $('#lookupPhone').value.replace(/\s/g, '');
      const found = pool.find(c => c.phone.replace(/\s/g, '') === v) || pool[0];
      closeModal();
      showScanClient(found);
    });
    $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  });
  syncQueue();
}

function scanIdle() {
  SCAN.step = 'idle'; SCAN.client = null; SCAN.amount = '';
  $('#scannerStage').innerHTML = `
    <div class="viewfinder" aria-hidden="true">
      <span class="viewfinder__corner"></span><span class="viewfinder__corner"></span>
      <span class="viewfinder__corner"></span><span class="viewfinder__corner"></span>
      <span class="viewfinder__line"></span>
    </div>
    <p class="scanner__hint">Placez le QR code de la carte du client dans le cadre.</p>
    <button class="btn btn--primary btn--lg" id="simScan"><i data-lucide="sparkles"></i> Simuler un scan</button>`;
  $('#scannerFoot').innerHTML = scanFooterHtml();
  icons();
  $('#simScan').addEventListener('click', () => {
    const pool = clientsOf(STATE.shopId);
    if (!pool.length) return toast('Aucun client dans cet établissement', 'alert-circle');
    showScanClient(pool[Math.floor(Math.random() * pool.length)]);
  });
  bindScanFooter();
}

/* En caisse, deux gestes très différents : créditer un passage, ou
   consommer ce que le client a acquis. On demande lequel avant tout,
   pour éviter de débiter une carte en croyant la créditer. */
function scanHeader(c) {
  const shop = shopById(c.shopId);
  const p = progressOf(c);
  return `
    <div class="scan-sheet__who">
      <span class="avatar avatar--lg" aria-hidden="true">${initials(c.name)}</span>
      <div class="scan-sheet__txt">
        <b>${esc(c.name)}</b>
        <span>${esc(shop.name)} · ${balanceLabel(c)}</span>
        <span>Prochaine récompense : ${esc(p.next)}</span>
      </div>
    </div>`;
}

/* Récompenses que le client peut s'offrir maintenant.
   Déduit du solde, jamais de c.available : ce dernier n'est qu'un
   indicateur d'affichage, et s'en servir ici créait une boucle où une
   carte à tampons restait « récompense disponible » après utilisation. */
function redeemableFor(c) {
  const prog = shopById(c.shopId).program;
  if (prog.type === 'stamps') {
    const last = prog.rewards[prog.rewards.length - 1];
    return c.balance >= prog.cells && last
      ? [{ label: last.label, cost: prog.cells, unit: 'tampons' }]
      : [];
  }
  return prog.rewards
    .filter(r => r.cost <= c.balance)
    .sort((a, b) => b.cost - a.cost)
    .map(r => ({ label: r.label, cost: r.cost, unit: prog.unit }));
}

function showScanClient(c) {
  SCAN.client = c; SCAN.amount = '';
  const prog = shopById(c.shopId).program;
  const options = redeemableFor(c);
  const canEarn = can('scan.earn');
  const canUse = can('scan.redeem') && options.length > 0;

  $('#scannerStage').innerHTML = `
    <div class="scan-sheet">
      ${scanHeader(c)}

      ${options.length ? `
        <div class="reward-banner">
          <i data-lucide="gift"></i>
          ${prog.type === 'stamps'
            ? `Récompense disponible : ${esc(options[0].label)}`
            : `${options.length} récompense${options.length > 1 ? 's' : ''} à portée de solde`}
        </div>` : ''}

      <p class="scan-ask">Que faites-vous pour ce client ?</p>

      <div class="scan-choice">
        <button class="scan-choice__btn" id="goCredit" ${canEarn ? '' : 'disabled'}>
          <span class="scan-choice__ico scan-choice__ico--add"><i data-lucide="plus"></i></span>
          <b>Créditer</b>
          <span>${prog.type === 'stamps' ? 'Ajouter un tampon' : 'Saisir le montant dépensé'}</span>
        </button>
        <button class="scan-choice__btn" id="goRedeem" ${canUse ? '' : 'disabled'}>
          <span class="scan-choice__ico scan-choice__ico--use"><i data-lucide="gift"></i></span>
          <b>Utiliser</b>
          <span>${prog.type === 'stamps' ? 'Remettre la récompense' : 'Déduire les points'}</span>
        </button>
      </div>

      ${!canEarn ? '<p class="field__hint" style="text-align:center;margin-top:12px">Votre accès ne permet pas de créditer un passage.</p>' : ''}
      ${can('scan.redeem') && !options.length
        ? '<p class="field__hint" style="text-align:center;margin-top:12px">Aucune récompense à utiliser pour l’instant.</p>' : ''}
      ${!can('scan.redeem') && options.length
        ? `<p class="field__hint" style="text-align:center;margin-top:12px">
             <i data-lucide="lock" style="width:13px;height:13px;vertical-align:-2px"></i>
             Appelez un gérant : votre accès ne permet pas d’utiliser les récompenses.</p>` : ''}

      <button class="btn btn--ghost btn--block" id="cancelScan" style="margin-top:14px">Annuler</button>
    </div>`;
  $('#scannerFoot').innerHTML = scanFooterHtml();
  icons();

  $('#cancelScan').addEventListener('click', scanIdle);
  $('#goCredit').addEventListener('click', () => scanCredit(c));
  $('#goRedeem').addEventListener('click', () => scanRedeem(c));
  bindScanFooter();
}

/* ---------- Créditer un passage ---------- */
function scanCredit(c) {
  const prog = shopById(c.shopId).program;
  SCAN.amount = '';

  const body = prog.type === 'stamps'
    ? `<div class="amount-display">
         <b>${c.balance} / ${prog.cells}</b>
         <span>deviendra ${Math.min(prog.cells, c.balance + 1)} / ${prog.cells}</span>
       </div>
       <button class="btn btn--primary btn--lg btn--block" id="addStamp" style="height:56px;font-size:17px;margin-top:14px">
         <i data-lucide="plus"></i> 1 tampon
       </button>`
    : `<div class="amount-display">
         <b id="amtVal">${money(0)}</b>
         <span id="amtPts">${prog.pointsPerUnit} ${prog.unit} par ${CURRENCY.code === 'EUR' ? 'euro' : CURRENCY.code} dépensé</span>
       </div>
       <div class="keypad">
         ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-key="${n}">${n}</button>`).join('')}
         <button data-key="c" aria-label="Effacer">C</button>
         <button data-key="0">0</button>
         <button data-key="del" aria-label="Supprimer le dernier chiffre"><i data-lucide="delete" style="width:19px;height:19px"></i></button>
       </div>
       <button class="btn btn--primary btn--lg btn--block" id="addPoints" disabled>Valider le passage</button>`;

  $('#scannerStage').innerHTML = `
    <div class="scan-sheet">
      ${scanHeader(c)}
      <p class="scan-ask"><i data-lucide="plus" aria-hidden="true"></i> Créditer un passage</p>
      ${body}
      <button class="btn btn--ghost btn--block" id="backChoice" style="margin-top:10px">
        <i data-lucide="arrow-left"></i> Retour
      </button>
    </div>`;
  $('#scannerFoot').innerHTML = scanFooterHtml();
  icons();

  $('#backChoice').addEventListener('click', () => showScanClient(c));

  if (prog.type === 'stamps') {
    $('#addStamp').addEventListener('click', () => {
      c.balance = Math.min(prog.cells, c.balance + 1);
      c.lastVisit = new Date();
      c.txs.unshift({ date: new Date(), type: 'earn', qty: 1, employee: me().name });
      if (c.balance >= prog.cells) c.available = prog.rewards[prog.rewards.length - 1].label;
      scanDone(c, '+ 1 tampon');
    });
  } else {
    const sync = () => {
      const amount = (+SCAN.amount || 0) / 100;
      const pts = amount >= prog.minAmount ? Math.floor(amount * prog.pointsPerUnit) : 0;
      $('#amtVal').textContent = money(amount, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      $('#amtPts').textContent = amount < prog.minAmount
        ? `Minimum d’achat : ${money(prog.minAmount)}`
        : `${num(pts)} ${prog.unit} seront ajoutés`;
      $('#addPoints').disabled = pts <= 0;
    };
    $$('[data-key]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.key;
      if (k === 'c') SCAN.amount = '';
      else if (k === 'del') SCAN.amount = SCAN.amount.slice(0, -1);
      else if (SCAN.amount.length < 7) SCAN.amount += k;
      sync();
    }));
    $('#addPoints').addEventListener('click', () => {
      const amount = (+SCAN.amount || 0) / 100;
      const pts = Math.floor(amount * prog.pointsPerUnit);
      c.balance += pts;
      c.lastVisit = new Date();
      c.txs.unshift({ date: new Date(), type: 'earn', qty: pts, amount, employee: me().name });
      const affordable = [...prog.rewards].reverse().find(r => r.cost <= c.balance);
      if (affordable) c.available = affordable.label;
      scanDone(c, `+ ${num(pts)} ${prog.unit}`);
    });
    sync();
  }
  bindScanFooter();
}

/* ---------- Utiliser une récompense ---------- */
function scanRedeem(c) {
  const prog = shopById(c.shopId).program;
  const options = redeemableFor(c);

  $('#scannerStage').innerHTML = `
    <div class="scan-sheet">
      ${scanHeader(c)}
      <p class="scan-ask"><i data-lucide="gift" aria-hidden="true"></i>
        ${prog.type === 'stamps' ? 'Remettre la récompense' : 'Quelle récompense le client utilise-t-il ?'}</p>

      <div class="redeem-list">
        ${options.map((o, i) => `
          <button class="redeem-opt" data-redeem="${i}">
            <span class="reward-row__ico"><i data-lucide="gift"></i></span>
            <span class="redeem-opt__txt">
              <b>${esc(o.label)}</b>
              <span>${prog.type === 'stamps'
                ? `Carte complète · le solde repart à 0`
                : `− ${num(o.cost)} ${o.unit} · il restera ${num(c.balance - o.cost)} ${o.unit}`}</span>
            </span>
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>`).join('')}
      </div>

      <button class="btn btn--ghost btn--block" id="backChoice" style="margin-top:14px">
        <i data-lucide="arrow-left"></i> Retour
      </button>
    </div>`;
  $('#scannerFoot').innerHTML = scanFooterHtml();
  icons();

  $('#backChoice').addEventListener('click', () => showScanClient(c));
  $$('[data-redeem]').forEach(b => b.addEventListener('click', () => {
    const o = options[+b.dataset.redeem];
    c.balance = Math.max(0, c.balance - o.cost);
    c.txs.unshift({ date: new Date(), type: 'redeem', qty: -o.cost, label: o.label, employee: me().name });
    /* La récompense signalée ne tient plus si le solde est retombé. */
    const encore = redeemableFor(c);
    c.available = encore.length ? encore[0].label : null;
    scanDone(c, `Récompense utilisée : ${o.label}`);
  }));
  bindScanFooter();
}

function scanDone(c, label) {
  if (STATE.offline) STATE.queue++;
  const prog = shopById(c.shopId).program;
  $('#scannerStage').innerHTML = `
    <div class="scan-sheet scan-done">
      <div class="scan-done__check" aria-hidden="true"><i data-lucide="check"></i></div>
      <div style="font-size:19px;font-weight:700;letter-spacing:-.02em">${esc(label)}</div>
      <p style="font-size:14px;color:var(--ink-2);margin-top:6px">${esc(c.name)} · nouveau solde : <b>${balanceLabel(c)}</b></p>
      ${c.available ? `<div class="reward-banner" style="margin-top:16px"><i data-lucide="gift"></i> Récompense débloquée : ${esc(c.available)}</div>` : ''}
      ${STATE.offline ? `<p class="field__hint" style="margin-top:12px"><i data-lucide="cloud-off" style="width:13px;height:13px;vertical-align:-2px"></i> Enregistré hors ligne, sera synchronisé au retour du réseau.</p>` : ''}
    </div>`;
  $('#scannerFoot').innerHTML = scanFooterHtml();
  icons();
  bindScanFooter();
  clearTimeout(scanTimer);
  scanTimer = setTimeout(scanIdle, 2000);
}

        <p>${esc(shop.name)} · étape ${WIZ.step} sur 4</p>
      </div>
      <div class="view__actions">
        <button class="btn btn--ghost" id="wizCancel"><i data-lucide="x"></i> Annuler</button>
      </div>
    </div>

    <div class="steps-head">
      ${WIZ_STEPS.map((s, i) => `
        <button class="step-chip ${WIZ.step === i + 1 ? 'is-active' : ''} ${WIZ.step > i + 1 ? 'is-done' : ''}" data-step="${i + 1}" ${i + 1 > 1 && !wizardValid(1) ? 'disabled' : ''}>
          <b>${WIZ.step > i + 1 ? '✓' : i + 1}</b> ${s}
        </button>`).join('')}
    </div>

    <div class="wizard">
      <div class="card">
        ${body}
        <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap">
          ${WIZ.step > 1 ? '<button class="btn btn--secondary" id="wizPrev"><i data-lucide="arrow-left"></i> Retour</button>' : ''}
          ${WIZ.step < 4
            ? '<button class="btn btn--primary" id="wizNext">Continuer <i data-lucide="arrow-right"></i></button>'
            : `<button class="btn btn--primary" id="wizSend"><i data-lucide="send"></i> ${WIZ.when === 'now' ? 'Envoyer maintenant' : 'Programmer l’envoi'}</button>`}
          <button class="btn btn--ghost" id="wizDraft">Enregistrer en brouillon</button>
        </div>
      </div>

      <div class="preview-pane">
        <div class="preview-tabs" role="group" aria-label="Appareil d’aperçu">
          <button data-dev="android" aria-pressed="${WIZ.device === 'android'}">Android</button>
          <button data-dev="ios" aria-pressed="${WIZ.device === 'ios'}">iPhone</button>
        </div>
        ${phonePreview(WIZ.title, WIZ.body, shop, WIZ.device)}
        <p class="field__hint" style="text-align:center;max-width:260px">
          Aperçu en direct de la notification sur l’écran verrouillé du client.
        </p>
      </div>
    </div>`;

  /* Saisie */
  const t = $('#wTitle');
  if (t) {
    t.addEventListener('input', e => {
      WIZ.title = e.target.value;
      $('.notif__t').textContent = WIZ.title || shop.name;
      const c = $('.field .counter');
      c.textContent = `${WIZ.title.length} / ${TITLE_MAX}`;
      c.classList.toggle('is-over', WIZ.title.length > TITLE_MAX);
    });
  }
  const b = $('#wBody');
  if (b) {
    b.addEventListener('input', e => {
      WIZ.body = e.target.value;
      $('.notif__b').textContent = WIZ.body || 'Votre message apparaîtra ici.';
      const c = $$('.field .counter')[1];
      c.textContent = `${WIZ.body.length} / ${BODY_MAX}`;
      c.classList.toggle('is-over', WIZ.body.length > BODY_MAX);
    });
  }

  $$('[data-aud]').forEach(n => n.addEventListener('click', () => { WIZ.audience = n.dataset.aud; renderWizard(); icons(); }));
  $$('[data-chan]').forEach(n => n.addEventListener('click', () => { WIZ.channel = n.dataset.chan; renderWizard(); icons(); }));
  $$('[data-when]').forEach(n => n.addEventListener('click', () => { WIZ.when = n.dataset.when; renderWizard(); icons(); }));
  $('#wDate')?.addEventListener('change', e => WIZ.date = e.target.value);
  $('#wTime')?.addEventListener('change', e => WIZ.time = e.target.value);
  $$('[data-dev]').forEach(n => n.addEventListener('click', () => { WIZ.device = n.dataset.dev; renderWizard(); icons(); }));
  $$('[data-step]').forEach(n => n.addEventListener('click', () => {
    const s = +n.dataset.step;
    if (s > 1 && !wizardValid(1)) { WIZ.touched = true; return renderWizard(); }
    WIZ.step = s; renderWizard(); icons();
  }));

  $('#wizPrev')?.addEventListener('click', () => { WIZ.step--; renderWizard(); icons(); });
  $('#wizNext')?.addEventListener('click', () => {
    WIZ.touched = true;
    if (!wizardValid(WIZ.step)) return renderWizard();
    WIZ.step++; WIZ.touched = false; renderWizard(); icons();
  });
  $('#wizCancel').addEventListener('click', closeWizard);
  $('#wizDraft').addEventListener('click', () => {
    CAMPAIGNS.unshift({ id: 'k' + Date.now(), shopId: shop.id, title: WIZ.title, body: WIZ.body,
      audience: WIZ.audience, channel: WIZ.channel, date: new Date(), status: 'draft', recipients: 0, opened: 0 });
    closeWizard();
    toast('Campagne enregistrée en brouillon', 'save');
  });
  $('#wizSend')?.addEventListener('click', () => {
    WIZ.touched = true;
    if (!wizardValid(4)) return renderWizard();
    const when = WIZ.when === 'later' ? new Date(`${WIZ.date}T${WIZ.time}`) : new Date();
    CAMPAIGNS.unshift({ id: 'k' + Date.now(), shopId: shop.id, title: WIZ.title, body: WIZ.body,
      audience: WIZ.audience, channel: WIZ.channel, date: when,
      status: WIZ.when === 'later' ? 'scheduled' : 'sent',
      recipients: count, opened: 0 });
    closeWizard();
    toast(WIZ.when === 'later'
      ? `Campagne programmée pour le ${dateFmt.format(when)}`
      : `Campagne envoyée à ${num(count)} clients`, 'send');
  });

  icons();
}

/* ---------- Automatisations ---------- */
/* Pastilles des établissements ciblés par une règle. */
function shopChips(ids) {
  const mine = myShops().map(s => s.id);
  const visible = ids.filter(id => mine.includes(id));
  const hidden = ids.length - visible.length;
  return visible.map(id => {
    const s = shopById(id);
    return `<span class="pill"><span class="legend__dot" style="background:${s.color}"></span>${esc(s.name)}</span>`;
  }).join('') + (hidden
    ? `<span class="pill" title="Établissements hors de votre périmètre">+ ${hidden} hors périmètre</span>`
    : '');
}

/* ---------- Éditeur d'automatisation ---------- */
const AUTO_EDIT = { open: false, id: null, device: 'android', touched: false, draft: null };
const AUTO_MSG_MAX = 160;

function blankAutomation() {
  return {
    title: '', trigger: 'absent', param: 30, channel: 'wallet', bonus: 'none', bonusQty: 100,
    message: '', shops: currentShop() ? [currentShop().id] : myShops().map(s => s.id)
  };
}

function openAutoEditor(id = null) {
  const src = id ? AUTOMATIONS.find(a => a.id === id) : null;
  AUTO_EDIT.open = true;
  AUTO_EDIT.id = id;
  AUTO_EDIT.touched = false;
  AUTO_EDIT.draft = src
    ? { title: src.title, trigger: src.trigger, param: src.param ?? triggerById(src.trigger)?.param?.def ?? 0,
        channel: src.channel || 'wallet', bonus: src.bonus || 'none', bonusQty: src.bonusQty || 100,
        message: src.message, shops: [...src.shops] }
    : blankAutomation();
  render();
}

function closeAutoEditor() { AUTO_EDIT.open = false; AUTO_EDIT.draft = null; render(); }

function autoErrors(d) {
  const e = {};
  if (!d.title.trim()) e.title = 'Donnez un nom à votre règle.';
  if (!d.message.trim()) e.message = 'Le message envoyé au client est obligatoire.';
  else if (d.message.length > AUTO_MSG_MAX) e.message = `Le message dépasse ${AUTO_MSG_MAX} caractères.`;
  if (!d.shops.length) e.shops = 'Choisissez au moins un établissement.';
  const p = triggerById(d.trigger)?.param;
  if (p && (!Number.isInteger(+d.param) || +d.param <= 0)) e.param = 'Indiquez un nombre entier positif.';
  return e;
}

  const d = AUTO_EDIT.draft;

    <div class="view__head">

      </div>

        <button class="btn btn--ghost" id="aeCancel"><i data-lucide="x"></i> Annuler</button>
      </div>
    </div>

    <div class="wizard">
      <div class="card">
        <div class="field${errs.title ? ' is-err' : ''}">
          <label for="aeTitle">Nom de la règle</label>
          <input class="input" id="aeTitle" value="${esc(d.title)}" placeholder="Relance des clients du samedi">
          <span class="field__hint">Visible par vous seul, pour vous y retrouver.</span>
          ${err('title')}
        </div>

        <p class="section-label">Déclencheur</p>
        <div class="radio-list">
          ${AUTO_TRIGGERS.map(x => `
            <button class="radio-opt ${d.trigger === x.id ? 'is-sel' : ''}" data-trig="${x.id}">
              <span class="radio-opt__mark" aria-hidden="true"></span>
              <span class="radio-opt__txt"><b>${x.label}</b><span>${x.desc}</span></span>
            </button>`).join('')}
        </div>

        ${t.param ? `
          <div class="field${errs.param ? ' is-err' : ''}" style="margin-top:18px">
            <label for="aeParam">${t.param.label}</label>
            ${t.param.free
              ? `<input class="input" id="aeParam" type="number" min="1" step="1" value="${d.param}" style="max-width:180px">`
              : `<select class="select" id="aeParam" style="max-width:280px">
                   ${t.param.options.map(o => `<option value="${o}"${+d.param === o ? ' selected' : ''}>${t.param.fmt(o)}</option>`).join('')}
                 </select>`}
            ${err('param')}
          </div>` : ''}

        <p class="section-label">Établissements ciblés</p>
        <div class="check-list check-list--inline">
          ${myShops().map(s => `
            <label class="check-row">
              <input type="checkbox" data-ae-shop="${s.id}" ${d.shops.includes(s.id) ? 'checked' : ''}>
              <span class="shop-logo shop-logo--sm" style="background:${s.color}" aria-hidden="true">${s.letter}</span>
              <span class="check-row__txt"><b>${esc(s.name)}</b><span>${esc(s.city)} · carte à ${s.program.type === 'stamps' ? 'tampons' : 'points'}</span></span>
            </label>`).join('')}
        </div>
        ${err('shops')}

        <p class="section-label">Message</p>
        <div class="field${errs.message ? ' is-err' : ''}">
          <label for="aeMsg" class="sr-only">Message envoyé au client</label>
          <textarea class="textarea" id="aeMsg" maxlength="${AUTO_MSG_MAX + 40}"
            placeholder="Vous nous manquez ! Votre carte vous attend avec vos points déjà acquis.">${esc(d.message)}</textarea>
          <span class="counter ${d.message.length > AUTO_MSG_MAX ? 'is-over' : ''}">${d.message.length} / ${AUTO_MSG_MAX}</span>
          ${err('message')}
        </div>

        <p class="section-label">Canal</p>
        <div class="radio-list">
          ${CHANNELS.map(c => `
            <button class="radio-opt ${d.channel === c.id ? 'is-sel' : ''}" data-ae-chan="${c.id}">
              <span class="radio-opt__mark" aria-hidden="true"></span>
              <span class="radio-opt__txt"><b>${c.label}</b><span>${c.desc}</span></span>
              ${c.id === 'wallet' ? '<span class="pill pill--yellow">Par défaut</span>' : ''}
            </button>`).join('')}
        </div>

        <p class="section-label">Avantage accordé</p>
        <div class="radio-list">
          ${AUTO_BONUS.map(b => `
            <button class="radio-opt ${d.bonus === b.id ? 'is-sel' : ''}" data-ae-bonus="${b.id}">
              <span class="radio-opt__mark" aria-hidden="true"></span>
              <span class="radio-opt__txt"><b>${b.label}</b><span>${b.desc}</span></span>
            </button>`).join('')}
        </div>
        ${d.bonus === 'points' ? `
          <div class="field" style="margin-top:14px">
            <label for="aeQty">Nombre de points offerts</label>
            <input class="input" id="aeQty" type="number" min="1" step="10" value="${d.bonusQty}" style="max-width:160px">
          </div>` : ''}
        ${d.bonus !== 'none' ? `
          <p class="field__hint" style="margin-top:10px">
            <i data-lucide="alert-triangle" style="width:13px;height:13px;vertical-align:-2px"></i>
            N’associez jamais un avantage à une demande d’avis : les règles de Google interdisent de récompenser un avis.
          </p>` : ''}

        <div style="display:flex;gap:8px;margin-top:26px;flex-wrap:wrap">
          <button class="btn btn--primary" id="aeSave"><i data-lucide="check"></i> ${AUTO_EDIT.id ? 'Enregistrer' : 'Créer l’automatisation'}</button>
          <button class="btn btn--ghost" id="aeCancel2">Annuler</button>
        </div>
      </div>

      <div class="preview-pane">
        <div class="preview-tabs" role="group" aria-label="Appareil d’aperçu">
          <button data-ae-dev="android" aria-pressed="${AUTO_EDIT.device === 'android'}">Android</button>
          <button data-ae-dev="ios" aria-pressed="${AUTO_EDIT.device === 'ios'}">iPhone</button>
        </div>
        ${phonePreview('', d.message, shop, AUTO_EDIT.device)}
        <div class="auto-recap">
          <p><i data-lucide="${t.icon}" aria-hidden="true"></i> <b>${t.label}</b></p>
          <p class="caption">${t.param ? `${t.param.fmt(d.param)}. ` : ''}${d.shops.length} établissement${d.shops.length > 1 ? 's' : ''} ciblé${d.shops.length > 1 ? 's' : ''}.</p>
        </div>
      </div>
    </div>`;

  $('#aeTitle').addEventListener('input', e => d.title = e.target.value);
  $('#aeMsg').addEventListener('input', e => {
    d.message = e.target.value;
    $('.notif__b').textContent = d.message || 'Votre message apparaîtra ici.';
    const c = $('#aeMsg').parentElement.querySelector('.counter');
    c.textContent = `${d.message.length} / ${AUTO_MSG_MAX}`;
    c.classList.toggle('is-over', d.message.length > AUTO_MSG_MAX);
  });
  $('#aeParam')?.addEventListener('change', e => { d.param = +e.target.value; renderAutoEditor(); });
  $('#aeQty')?.addEventListener('input', e => d.bonusQty = Math.max(1, +e.target.value || 1));

  $$('[data-trig]').forEach(b => b.addEventListener('click', () => {
    d.trigger = b.dataset.trig;
    d.param = triggerById(d.trigger)?.param?.def ?? 0;
    renderAutoEditor();
  }));
  $$('[data-ae-chan]').forEach(b => b.addEventListener('click', () => { d.channel = b.dataset.aeChan; renderAutoEditor(); }));
  $$('[data-ae-bonus]').forEach(b => b.addEventListener('click', () => { d.bonus = b.dataset.aeBonus; renderAutoEditor(); }));
  $$('[data-ae-dev]').forEach(b => b.addEventListener('click', () => { AUTO_EDIT.device = b.dataset.aeDev; renderAutoEditor(); }));
  $$('[data-ae-shop]').forEach(cb => cb.addEventListener('change', () => {
    const id = cb.dataset.aeShop;
    d.shops = cb.checked ? [...new Set([...d.shops, id])] : d.shops.filter(x => x !== id);
    renderAutoEditor();
  }));

  $('#aeCancel').addEventListener('click', closeAutoEditor);
  $('#aeCancel2').addEventListener('click', closeAutoEditor);
  $('#aeSave').addEventListener('click', () => {
    AUTO_EDIT.touched = true;
    if (Object.keys(autoErrors(d)).length) return renderAutoEditor();

    const stats = {};
    d.shops.forEach(id => stats[id] = { sent: 0, returned: 0 });

    if (AUTO_EDIT.id) {
      const a = AUTOMATIONS.find(x => x.id === AUTO_EDIT.id);
      /* Les résultats des établissements encore ciblés sont conservés. */
      d.shops.forEach(id => { if (a.stats[id]) stats[id] = a.stats[id]; });
      Object.assign(a, {
        title: d.title.trim(), trigger: d.trigger, param: d.param, channel: d.channel,
        bonus: d.bonus, bonusQty: d.bonusQty, message: d.message.trim(),
        shops: [...d.shops], stats, icon: triggerById(d.trigger).icon,
        desc: triggerById(d.trigger).desc
      });
      closeAutoEditor();
      toast('Automatisation enregistrée', 'save');
    } else {
      AUTOMATIONS.push({
        id: 'a' + Date.now(), custom: true, on: true,
        icon: triggerById(d.trigger).icon,
        title: d.title.trim(), desc: triggerById(d.trigger).desc,
        trigger: d.trigger, param: d.param, channel: d.channel,
        bonus: d.bonus, bonusQty: d.bonusQty,
        message: d.message.trim(), shops: [...d.shops], stats
      });
      closeAutoEditor();
      toast(`« ${d.title.trim()} » est active`, 'repeat');
    }
  });

  icons();
}

function renderAutomations() {
  if (AUTO_EDIT.open) return renderAutoEditor();
  const list = automationsInScope();
  const multi = myShops().length > 1;

  $('#view').innerHTML = `
    <div class="view__head">
      <div>
        <h1>Automatisations</h1>
        <p>${list.filter(a => a.on).length} règle${list.filter(a => a.on).length > 1 ? 's' : ''} active${list.filter(a => a.on).length > 1 ? 's' : ''} sur ${list.length} · ${esc(shopLabel())}</p>
      </div>
      <div class="view__actions">
        ${can('campaigns.manage') ? '<button class="btn btn--secondary" id="toCampaigns"><i data-lucide="arrow-left"></i> Campagnes</button>' : ''}
        <button class="btn btn--primary" id="newAuto"><i data-lucide="plus"></i> Nouvelle automatisation</button>
      </div>
    </div>

    ${multi ? `
      <p class="field__hint" style="margin-bottom:16px">
        <i data-lucide="info" style="width:13px;height:13px;vertical-align:-2px"></i>
        ${STATE.shopId === 'all'
          ? 'Vue consolidée : toutes vos règles, avec les établissements qu’elles ciblent et les résultats cumulés.'
          : `Seules les règles qui ciblent ${esc(shopLabel())} sont affichées. Basculez sur « Tous les établissements » pour les voir toutes.`}
      </p>` : ''}

    <div id="rules"></div>`;

  const wrap = $('#rules');

  if (!list.length) {
    wrap.appendChild(el('p', 'empty',
      '<i data-lucide="repeat"></i>Aucune automatisation ne cible cet établissement pour l’instant.'));
  }

  list.forEach(a => {
    const st = automationStats(a);
    const targeted = a.shops.filter(id => myShops().some(s => s.id === id));

    const node = el('div', 'rule', `
      <div class="rule__top">
        <span class="rule__ico"><i data-lucide="${a.icon}" aria-hidden="true"></i></span>
        <span class="rule__txt">
          <b>${esc(a.title)}${a.custom ? '<span class="pill pill--yellow">Personnalisée</span>' : ''}</b>
          <p>${a.desc}</p>
          <span class="rule__chips">
            ${a.trigger ? `<span class="pill"><i data-lucide="${triggerById(a.trigger).icon}"></i>${triggerLabel(a)}</span>` : ''}
            ${a.bonus && a.bonus !== 'none'
              ? `<span class="pill pill--ok"><i data-lucide="gift"></i>${a.bonus === 'stamp' ? '1 tampon offert' : num(a.bonusQty) + ' points offerts'}</span>`
              : ''}
          </span>
          <span class="rule__chips">${shopChips(a.shops)}</span>
        </span>
        ${a.custom ? `
          <button class="icon-btn icon-btn--plain" data-auto-edit="${a.id}" aria-label="Modifier" title="Modifier"><i data-lucide="pencil"></i></button>
          <button class="icon-btn icon-btn--plain" data-auto-del="${a.id}" aria-label="Supprimer" title="Supprimer"><i data-lucide="trash-2"></i></button>`
          : ''}
        <button class="switch" role="switch" aria-checked="${a.on}" aria-label="Activer : ${esc(a.title)}"></button>
      </div>
      <div class="rule__body">
        <div class="field" style="margin:0">
          <label>Établissements ciblés</label>
          <div class="check-list check-list--inline">
            ${myShops().map(s => `
              <label class="check-row">
                <input type="checkbox" data-rule-shop="${s.id}" ${a.shops.includes(s.id) ? 'checked' : ''}>
                <span class="shop-logo shop-logo--sm" style="background:${s.color}" aria-hidden="true">${s.letter}</span>
                <span class="check-row__txt">
                  <b>${esc(s.name)}</b>
                  <span>${esc(s.city)} · ${a.stats[s.id] ? num(a.stats[s.id].sent) + ' envois sur 30 j' : 'aucun envoi'}</span>
                </span>
              </label>`).join('')}
          </div>
          ${!targeted.length
            ? '<span class="field__err" style="display:block">Aucun établissement ciblé : cette règle ne s’applique nulle part.</span>'
            : ''}
        </div>

        ${a.delayKey ? `
          <div class="field" style="margin:0">
            <label for="d-${a.id}">Déclencher après</label>
            <select class="select" id="d-${a.id}" style="max-width:220px">
              ${[15, 30, 60].map(d => `<option value="${d}"${a.delay === d ? ' selected' : ''}>${d} jours sans passage</option>`).join('')}
            </select>
          </div>` : ''}

        <div class="field" style="margin:0">
          <label for="m-${a.id}">Message</label>
          <textarea class="textarea" id="m-${a.id}" style="min-height:64px">${esc(a.message)}</textarea>
        </div>

        ${a.noReward ? `
          <p class="field__hint"><i data-lucide="info" style="width:13px;height:13px;vertical-align:-2px"></i>
          Aucune récompense n’est associée : les règles de Google interdisent de récompenser un avis.</p>` : ''}
        ${a.pointsOnly ? `
          <p class="field__hint"><i data-lucide="info" style="width:13px;height:13px;vertical-align:-2px"></i>
          Sans effet sur un établissement à carte à tampons.</p>` : ''}

        <div class="rule__stats">
          <span>${STATE.shopId === 'all' && targeted.length > 1 ? 'Cumul sur 30 jours' : 'Sur 30 jours'} : <b>${num(st.sent)}</b> envois</span>
          <span><b>${num(st.returned)}</b> clients revenus</span>
          ${st.sent ? `<span>Taux de retour : <b>${Math.round(st.returned / st.sent * 100)} %</b></span>` : ''}
        </div>
      </div>`);
    wrap.appendChild(node);

    $('.switch', node).addEventListener('click', e => {
      a.on = !a.on;
      e.currentTarget.setAttribute('aria-checked', String(a.on));
      toast(`${a.title} · ${a.on ? 'activée' : 'désactivée'}`, a.on ? 'check-circle-2' : 'circle-off');
    });

    /* Un gérant ne peut cibler que ses propres établissements : la liste
       ne lui en propose pas d'autres, et les cibles hors périmètre
       posées par le super gérant restent intactes. */
    $$('[data-rule-shop]', node).forEach(cb => cb.addEventListener('change', () => {
      const id = cb.dataset.ruleShop;
      a.shops = cb.checked
        ? [...new Set([...a.shops, id])]
        : a.shops.filter(x => x !== id);
      if (cb.checked && !a.stats[id]) a.stats[id] = { sent: 0, returned: 0 };
      render();
      toast(cb.checked
        ? `${a.title} s’applique maintenant à ${shopById(id).name}`
        : `${a.title} retirée de ${shopById(id).name}`, 'store');
    }));

    $(`#m-${a.id}`, node).addEventListener('change', e => {
      a.message = e.target.value;
      toast('Message enregistré', 'save');

/* ============================================================
   Carte Wallet dessinée en HTML/CSS (aperçu partagé)
   ============================================================ */
function walletCardHtml(cfg, { variant = 'google', side = 'front', balance = null } = {}) {
  const bal = balance == null
    ? (cfg.type === 'stamps' ? Math.min(cfg.cells, Math.ceil(cfg.cells * .6)) : Math.round(maxCost(cfg) * .55))
    : balance;

  if (side === 'back') {
    return `
      <div class="wcard wcard--tall" style="background:${cfg.bg};color:${cfg.text}">
        <div class="wcard__top">
          <span class="wcard__logo" style="color:${cfg.bg}">${esc(cfg.logoLetter)}</span>
          <div><div class="wcard__name">${esc(cfg.shopName)}</div><div class="wcard__prog">${esc(cfg.programName)}</div></div>
        </div>
        <div class="wcard__back">${esc(cfg.back || 'Informations au dos de la carte.')}</div>
        <div class="wcard__foot" style="margin-top:auto"><span>Assistance</span><span>${esc(cfg.contact || 'contact@exemple.com')}</span></div>
      </div>`;
  }

  let body;
  if (cfg.type === 'stamps') {
    const stamps = Array.from({ length: cfg.cells }, (_, i) => {
      const filled = i < bal;
      const reward = cfg.rewards.some(r => r.cell === i + 1);
      return `<span class="wstamp ${filled ? 'is-full' : ''} ${cfg.cellStyle === 'dashed' && !filled ? 'wstamp--dashed' : ''}"
                    ${reward && !filled ? `style="border-color:${cfg.text}"` : ''}>
                <i data-lucide="${reward && !filled ? 'gift' : cfg.stampIcon}"></i>
              </span>`;
    }).join('');
    body = `
      <div class="wcard__body">
        <div class="wcard__label" style="color:${cfg.label}">Tampons</div>
        <div class="wcard__value">${bal} / ${cfg.cells}</div>
        <div class="wcard__stamps">${stamps}</div>
      </div>`;
  } else {
    const next = (cfg.rewards.filter(r => r.cost > bal).sort((a, b) => a.cost - b.cost)[0]) || cfg.rewards[cfg.rewards.length - 1];
    const target = next ? next.cost : Math.max(1, bal);
    body = `
      <div class="wcard__body">
        <div class="wcard__label" style="color:${cfg.label}">Solde</div>
        <div class="wcard__value">${num(bal)} ${esc(cfg.unit)}</div>
        ${cfg.showProgress ? `
          <div class="wcard__bar"><i style="width:${Math.min(100, Math.round(bal / target * 100))}%"></i></div>
          <div class="wcard__foot"><span style="color:${cfg.label}">Prochain palier</span><span>${next ? esc(next.label) : '—'}</span></div>` : ''}
      </div>`;
  }

  /* Le QR est le seul format de code client : lisible depuis un écran
     de téléphone, contrairement au code-barres. */
  const code = `<div class="wcard__code">${qrHtml(5)}</div>`;

  const header = variant === 'apple'
    ? `<div class="wcard__top" style="padding-bottom:11px;border-bottom:1px solid ${cfg.text}33;margin-bottom:4px">
         <span class="wcard__logo" style="color:${cfg.bg}">${esc(cfg.logoLetter)}</span>
         <div style="flex:1"><div class="wcard__name">${esc(cfg.shopName)}</div></div>
         <div style="text-align:right"><div class="wcard__label" style="color:${cfg.label}">${cfg.type === 'stamps' ? 'Tampons' : 'Solde'}</div>
         <div style="font-size:15px;font-weight:700">${cfg.type === 'stamps' ? bal + '/' + cfg.cells : num(bal)}</div></div>
       </div>`
    : `<div class="wcard__top">
         <span class="wcard__logo" style="color:${cfg.bg}">${esc(cfg.logoLetter)}</span>
         <div><div class="wcard__name">${esc(cfg.shopName)}</div><div class="wcard__prog" style="color:${cfg.label}">${esc(cfg.programName)}</div></div>
       </div>`;

  const inner = `
    <div class="wcard wcard--tall" style="background:${cfg.bg};color:${cfg.text}">
      ${header}
      ${cfg.banner ? '<div class="wcard__banner">Image de bannière · 1032 × 336 px</div>' : ''}
      ${body}
      ${code}
    </div>`;

  if (variant === 'web') {
    return `
      <div style="background:var(--gray);border:1px solid var(--border);border-radius:18px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:6px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--border)">
          <i data-lucide="lock" style="width:12px;height:12px;color:var(--ink-2)"></i>
          <span style="font-size:11px;color:var(--ink-2)">carte.exemple.com</span>
        </div>
        <div style="padding:14px">${inner}</div>
      </div>`;
  }
  return inner;
}

function maxCost(cfg) {
  return cfg.rewards.length ? Math.max(...cfg.rewards.map(r => r.cost || 0)) : 1000;
}

/* Convertit un programme d'établissement en configuration d'éditeur. */

    bg: shop.color, text: shop.textColor, label: 'rgba(255,255,255,.72)',
    type: p.type, cells: p.cells || 10, stampIcon: p.icon || 'star', cellStyle: p.cellStyle || 'outline',
    unit: p.unit || 'points', pointsPerUnit: p.pointsPerUnit || 1, minAmount: p.minAmount || 0,
    showProgress: p.showProgress !== false, banner: false,
    welcomeStamp: !!p.welcomeStamp, welcomePoints: p.welcomePoints || 0, birthdayPoints: p.birthdayPoints || 0,

    rewards: p.rewards.map(r => ({ ...r })),

/* Génère un vrai fichier SVG téléchargeable. */
function downloadQrSvg(code) {
  const N = 11, cell = 16, pad = 24, size = N * cell + pad * 2;
  const on = (r, c) => {
    const corner = (r < 3 && c < 3) || (r < 3 && c > N - 4) || (r > N - 4 && c < 3);
    if (corner) { const rr = r < 3 ? r : N - 1 - r, cc = c < 3 ? c : N - 1 - c; return !(rr === 1 && cc === 1); }
    return ((r * 7 + c * 5 + (r * c) % 3) % 3) !== 0;
  };
  let rects = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (on(r, c)) rects += `<rect x="${pad + c * cell}" y="${pad + r * cell}" width="${cell}" height="${cell}" fill="#1D1D1F"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size + 34}" viewBox="0 0 ${size} ${size + 34}">
<rect width="100%" height="100%" fill="#FFFFFF"/>${rects}
<text x="${size / 2}" y="${size + 20}" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#6E6E73">${code}</text>
</svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = el('a'); a.href = url; a.download = `qr-${code.toLowerCase()}.svg`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`QR code ${code} téléchargé`, 'download');
}
