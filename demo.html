<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backino — Compte de démonstration</title>
<meta name="description" content="Compte de démonstration : trois établissements, cent cinquante clients fictifs, quatre-vingt-dix jours d'historique.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#151F28">

<link rel="icon" type="image/svg+xml" href="assets/marque/favicon.svg">
<link rel="icon" type="image/svg+xml" href="assets/marque/favicon-sombre.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/marque/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Backino — Compte de démonstration
   Mêmes jetons de design que la landing page.
   ============================================================ */
:root{
  --yellow:#FFF75C;
  --yellow-light:#FFFCD6;
  --ink:#1D1D1F;
  --ink-2:#6E6E73;
  --page:#FFFFFF;
  --gray:#F5F5F7;
  --border:#E5E5EA;
  --success:#34C759;
  --warning:#FF9F0A;
  --error:#FF3B30;

  --r-card:20px;
  --r-pill:980px;
  --sidebar:260px;
  --banner-h:40px;
  --font:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);font-size:15px;line-height:1.5;
  color:var(--ink);background:var(--gray);-webkit-font-smoothing:antialiased;
  overflow-x:hidden
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   Composants partagés
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 18px;border-radius:var(--r-pill);
  font-size:14px;font-weight:600;letter-spacing:-.01em;
  border:1px solid transparent;background:none;cursor:pointer;white-space:nowrap;
  transition:background .18s var(--ease),transform .18s var(--ease),opacity .18s
}
.btn:active{transform:scale(.98)}
.btn--primary{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.btn--primary:hover{background:#fffa8f}
.btn--secondary{background:#fff;color:var(--ink);border-color:var(--border)}
.btn--secondary:hover{background:var(--gray)}
.btn--ghost{background:transparent;color:var(--ink-2)}
.btn--ghost:hover{background:var(--gray);color:var(--ink)}
.btn--danger{background:#fff;color:var(--error);border-color:var(--border)}
.btn--danger:hover{background:rgba(255,59,48,.08)}
.btn--sm{height:32px;padding:0 13px;font-size:13px}
.btn--lg{height:48px;padding:0 24px;font-size:16px}
.btn--block{width:100%}
.btn [data-lucide]{width:16px;height:16px;flex:none}
.btn--lg [data-lucide]{width:18px;height:18px}
.btn[disabled]{opacity:.45;pointer-events:none}

.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:#fff;
  display:grid;place-items:center;cursor:pointer;flex:none;transition:background .18s
}
.icon-btn:hover{background:var(--gray)}
.icon-btn [data-lucide]{width:18px;height:18px}
.icon-btn--plain{border-color:transparent;background:transparent}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:20px}
.card__head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.card__head h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card__head .btn,.card__head .seg{margin-left:auto}

.pill{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:var(--r-pill);
  font-size:12px;font-weight:600;background:var(--gray);color:var(--ink-2);white-space:nowrap
}
.pill [data-lucide]{width:12px;height:12px}
.pill--yellow{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pill--ok{background:rgba(52,199,89,.14);color:#1a7a33}
.pill--warn{background:rgba(255,159,10,.16);color:#8a5200}
.pill--err{background:rgba(255,59,48,.12);color:#c22b22}
.pill--ink{background:var(--ink);color:#fff}
/* display:inline-flex masquerait l'attribut hidden du navigateur. */
.pill[hidden]{display:none}

.seg{display:inline-flex;gap:3px;padding:3px;background:var(--gray);border-radius:var(--r-pill)}
.seg button{
  height:28px;padding:0 13px;border:none;border-radius:var(--r-pill);background:transparent;
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .18s,color .18s
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.switch{
  width:42px;height:26px;border-radius:99px;background:var(--border);position:relative;flex:none;
  border:none;cursor:pointer;padding:0;transition:background .2s
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)
}
.switch[aria-checked="true"]{background:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}

.field{display:grid;gap:7px;margin-bottom:16px}
.field>label{font-size:13px;font-weight:600}
.field__hint{font-size:12px;color:var(--ink-2)}
.field__err{font-size:12px;color:var(--error);display:none}
.field.is-err .field__err{display:block}
.field.is-err .input,.field.is-err .select{border-color:var(--error)}
.input,.select,.textarea{
  width:100%;height:40px;padding:0 13px;border:1px solid var(--border);border-radius:11px;
  background:#fff;font-size:14px;transition:border-color .15s
}
.textarea{height:auto;padding:11px 13px;resize:vertical;min-height:84px;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);outline:none}
.select{
  -webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236E6E73' stroke-width='2' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:34px
}
.search{position:relative;flex:1;min-width:0}
.search [data-lucide]{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-2);pointer-events:none}
.search .input{padding-left:36px}

.avatar{
  width:36px;height:36px;border-radius:50%;background:var(--yellow);border:1px solid var(--ink);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink);flex:none
}
.avatar--gray{background:var(--gray);border-color:var(--border);color:var(--ink-2)}
.avatar--sm{width:28px;height:28px;font-size:11px}
.avatar--lg{width:56px;height:56px;font-size:19px}

.empty{padding:48px 20px;text-align:center;color:var(--ink-2)}
.empty [data-lucide]{width:32px;height:32px;margin:0 auto 12px;stroke-width:1.5;display:block}

/* ============================================================
   Bandeau démo
   ============================================================ */
.demo-banner{
  position:fixed;inset:0 0 auto;z-index:60;height:var(--banner-h);
  background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;
  padding:0 16px;font-size:13px
}
.demo-banner__dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);flex:none}
.demo-banner__logo{display:flex;align-items:center;flex:none}
.demo-banner__logo img{height:20px;width:auto;display:block}
@media (max-width:639px){.demo-banner__logo{display:none}}
.demo-banner__txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.82)}
.demo-banner .btn{height:28px;font-size:12px;padding:0 13px}
.narrow-only{display:none}
@media (max-width:639px){
  .wide-only{display:none}
  .narrow-only{display:inline}
}

/* ============================================================
   Ossature : barre latérale (desktop) / barre d'onglets (mobile)
   ============================================================ */
.app{display:flex;min-height:100vh;padding-top:var(--banner-h)}

.sidebar{
  position:fixed;top:var(--banner-h);bottom:0;left:0;width:var(--sidebar);
  background:var(--gray);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:14px;gap:6px;z-index:40
}
.sidebar__nav{display:grid;gap:3px;margin-top:10px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  height:42px;padding:0 13px;border:none;border-radius:11px;background:transparent;
  font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;text-align:left;
  transition:background .18s,color .18s
}
.nav-item:hover{background:rgba(0,0,0,.04);color:var(--ink)}
.nav-item [data-lucide]{width:19px;height:19px;flex:none}
.nav-item.is-active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.nav-item--locked{color:#AEAEB2;cursor:default}
.nav-item--locked:hover{background:transparent;color:#AEAEB2}
.nav-item__lock{width:14px;height:14px;margin-left:auto;opacity:.8}
.nav-item.is-active::before{
  content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--yellow);
  box-shadow:1px 0 0 var(--ink)
}
.sidebar__foot{margin-top:auto;display:grid;gap:3px;padding-top:12px;border-top:1px solid var(--border)}
.sidebar__me{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:#fff;
  border:1px solid var(--border)
}
.sidebar__me{width:100%;cursor:pointer;text-align:left;transition:border-color .18s}
.sidebar__me:hover{border-color:var(--ink)}
.sidebar__me__txt{min-width:0;flex:1}
.sidebar__me__txt b{display:block;font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar__me__txt span{display:block;font-size:12px;color:var(--ink-2)}
.sidebar__me>[data-lucide]{width:15px;height:15px;color:var(--ink-2);flex:none}
.topbar__me{
  margin-left:auto;border:1px solid var(--border);background:#fff;border-radius:var(--r-pill);
  display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;cursor:pointer;flex:none
}
.topbar__me b{font-size:12px;font-weight:600}
.topbar__me [data-lucide]{width:14px;height:14px;color:var(--ink-2)}

.main{flex:1;min-width:0;margin-left:var(--sidebar);display:flex;flex-direction:column}
.topbar{display:none}
.view{padding:28px 24px 64px;max-width:1280px;width:100%;margin:0 auto}
.view__head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.view__head h1{font-size:28px;font-weight:700;letter-spacing:-.025em}
.view__head p{font-size:14px;color:var(--ink-2);margin-top:4px}
.view__head .view__actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.tabbar{display:none}

/* ============================================================
   Sélecteur d'établissement
   ============================================================ */
.shop-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
  border:1px solid var(--border);border-radius:13px;background:#fff;cursor:pointer;text-align:left;
  transition:border-color .18s
}
.shop-btn:hover{border-color:var(--ink)}
.shop-btn__txt{flex:1;min-width:0}
.shop-btn__txt b{display:block;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-btn__txt span{display:block;font-size:12px;color:var(--ink-2)}
.shop-btn [data-lucide]{width:16px;height:16px;color:var(--ink-2);flex:none}
.shop-logo{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  color:#fff;font-size:14px;font-weight:700
}
.shop-logo--sm{width:26px;height:26px;border-radius:8px;font-size:11px}
.shop-logo--lg{width:44px;height:44px;border-radius:13px;font-size:18px}
.shop-logo--all{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;
  transition:opacity .25s var(--ease)
}
.sheet-backdrop.is-open{opacity:1;pointer-events:auto}

.shop-menu{
  position:fixed;z-index:90;width:320px;max-width:calc(100vw - 24px);
  background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.3);padding:12px;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)
}
.shop-menu.is-open{opacity:1;transform:none;pointer-events:auto}
.shop-menu__list{max-height:min(420px,50vh);overflow:auto;margin:10px -4px;padding:0 4px}
.shop-opt{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:none;border-radius:12px;
  background:transparent;cursor:pointer;text-align:left;transition:background .15s
}
.shop-opt:hover{background:var(--gray)}
.shop-opt.is-active{background:var(--yellow-light);box-shadow:inset 0 0 0 1px rgba(29,29,31,.18)}
.shop-opt__txt{flex:1;min-width:0}
.shop-opt__txt b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.shop-opt__txt span{display:block;font-size:12px;color:var(--ink-2)}
.shop-opt [data-lucide]{width:17px;height:17px;color:var(--ink);flex:none}
.shop-menu__add{
  display:flex;align-items:center;gap:9px;width:100%;padding:11px 10px;border:none;
  border-top:1px solid var(--border);background:transparent;cursor:pointer;
  font-size:14px;font-weight:600;border-radius:0 0 12px 12px;margin-top:4px
}
.shop-menu__add:hover{background:var(--gray)}
.shop-menu__add [data-lucide]{width:17px;height:17px}
.shop-menu__title{
  font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);padding:4px 10px 0
}
.shop-menu__note{
  display:flex;gap:8px;font-size:12px;line-height:1.45;color:var(--ink-2);
  border-top:1px solid var(--border);padding:11px 10px 4px;margin-top:4px
}
.shop-menu__note [data-lucide]{width:14px;height:14px;flex:none;margin-top:2px}
.shop-menu__out{color:var(--error);border-top:none;margin-top:0}
.shop-menu__out:hover{background:rgba(255,59,48,.08)}
#logoutSide{color:var(--error)}
#logoutSide:hover{background:rgba(255,59,48,.08);color:var(--error)}

/* Transition de contenu au changement d'établissement */
.view.is-swapping{opacity:0;transition:opacity .16s var(--ease)}
.view{transition:opacity .22s var(--ease)}

/* ============================================================
   Toasts
   ============================================================ */
.toasts{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  display:grid;gap:9px;width:max-content;max-width:calc(100vw - 28px)
}
.toast{
  display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;
  padding:12px 17px;border-radius:var(--r-pill);font-size:14px;font-weight:500;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.5);animation:toastIn .28s var(--ease)
}
.toast [data-lucide]{width:17px;height:17px;color:var(--yellow);flex:none}
.toast.is-out{animation:toastOut .22s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================================================
   5.1 Tableau de bord
   ============================================================ */
/* min-width:0 : sans cela un enfant de grille refuse de descendre sous
   la largeur de son contenu et fait déborder la vue en mobile. */
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.grid--kpi{grid-template-columns:repeat(4,1fr)}
.grid--2{grid-template-columns:1fr 1fr}
.grid--3{grid-template-columns:repeat(3,1fr)}
.grid--main{grid-template-columns:1.6fr 1fr;align-items:start}

.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:18px}
.kpi__top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.kpi__ico{width:30px;height:30px;border-radius:9px;background:var(--gray);display:grid;place-items:center;flex:none}
.kpi__ico [data-lucide]{width:16px;height:16px;stroke-width:1.9}
.kpi__top span{font-size:13px;color:var(--ink-2);font-weight:500}
.kpi__val{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kpi__delta{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:9px}
.kpi__delta [data-lucide]{width:13px;height:13px}
.kpi__delta.up{color:#1a7a33}
.kpi__delta.down{color:#c22b22}
.kpi__delta small{color:var(--ink-2);font-weight:500}

.chart-wrap{position:relative;height:260px}
.donut-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:none;position:relative}
.donut__hole{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none
}
.donut__hole b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.donut__hole span{display:block;font-size:11px;color:var(--ink-2)}
.legend{display:grid;gap:11px;flex:1;min-width:160px}
.legend__row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px}
.legend__dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend__row b{font-weight:600}

.list{display:grid;gap:2px}
.list>*,.timeline>*,.radio-list>*,.kv>*{min-width:0}
.list__row{
  display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;
  transition:background .15s
}
.list__row+.list__row{border-top:1px solid var(--border);border-radius:12px}
.list__row:hover{background:var(--gray)}
.list__txt{flex:1;min-width:0}
.list__txt b{display:block;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list__txt span{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list__right{text-align:right;flex:none}
.list__right b{display:block;font-size:14px;font-weight:600}
.list__right span{display:block;font-size:11px;color:var(--ink-2)}

.ai-card{background:var(--ink);color:#fff;border-radius:var(--r-card);padding:20px}
.ai-card .card__head h3{color:#fff}
.ai-card__item{
  display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:13px;
  background:rgba(255,255,255,.07);margin-bottom:9px
}
.ai-card__item:last-child{margin-bottom:0}
.ai-card__ico{
  width:30px;height:30px;border-radius:9px;background:var(--yellow);color:var(--ink);
  display:grid;place-items:center;flex:none
}
.ai-card__ico [data-lucide]{width:16px;height:16px}
.ai-card__txt{flex:1;min-width:0}
.ai-card__txt b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.ai-card__txt span{display:block;font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
.ai-card .btn--primary{border-color:transparent}

.scan-hint{
  display:flex;align-items:center;gap:16px;background:var(--yellow-light);
  border:1px solid rgba(29,29,31,.12);border-radius:var(--r-card);padding:16px 20px
}
.scan-hint__qr{width:76px;height:76px;background:#fff;border-radius:10px;padding:6px;flex:none;border:1px solid var(--border)}
.scan-hint b{display:block;font-size:15px;font-weight:600}
.scan-hint p{font-size:13px;color:var(--ink-2);margin-top:3px}
.qr{display:grid;grid-template-columns:repeat(11,1fr);gap:1px;width:100%;height:100%}
.qr i{border-radius:.5px}
.qr i.on{background:var(--ink)}

/* ============================================================
   5.2 Clients
   ============================================================ */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .select{width:auto;min-width:150px}

.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);
  padding:12px 11px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--gray)
}
thead th button{
  display:inline-flex;align-items:center;gap:5px;border:none;background:none;cursor:pointer;
  font:inherit;color:inherit;padding:0
}
thead th button [data-lucide]{width:13px;height:13px;opacity:.4}
thead th button.is-sorted [data-lucide]{opacity:1}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--gray)}
tbody td{padding:10px 11px;vertical-align:middle;white-space:nowrap;font-size:13.5px}
td .who{display:flex;align-items:center;gap:9px}
td .who b{font-weight:600}
.support-ico{
  width:26px;height:26px;border-radius:8px;background:var(--gray);display:grid;place-items:center;flex:none
}
.support-ico [data-lucide]{width:14px;height:14px;stroke-width:1.9}
.pager{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--ink-2)}
.pager .btn{margin-left:auto}
.pager__btns{display:flex;gap:6px;margin-left:auto}

.cards-list{display:none;gap:10px}
.client-card{
  background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;
  display:flex;gap:11px;align-items:center;cursor:pointer;width:100%;text-align:left
}
.client-card__txt{flex:1;min-width:0}
/* Enfants directs seulement : les pastilles imbriquées doivent rester
   en ligne et ne pas hériter du display:block. */
.client-card__txt>b{display:block;font-size:15px;font-weight:600}
.client-card__txt>span{display:block;font-size:12px;color:var(--ink-2)}
.client-card__meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}

/* Panneau latéral / plein écran */
.panel{
  position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;z-index:95;
  box-shadow:-20px 0 60px -20px rgba(0,0,0,.3);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s var(--ease);visibility:hidden
}
.panel.is-open{transform:none;visibility:visible}
.panel__head{
  display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);flex:none
}
.panel__head h2{font-size:17px;font-weight:600;flex:1;min-width:0}
.panel__body{flex:1;overflow:auto;padding:18px;-webkit-overflow-scrolling:touch}
.panel__foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;flex:none}

.kv{display:grid;gap:1px;background:var(--border);border-radius:14px;overflow:hidden;margin-bottom:18px}
.kv__row{display:flex;gap:12px;background:#fff;padding:11px 13px;font-size:14px}
.kv__row span{color:var(--ink-2);flex:none;width:44%}
.kv__row b{font-weight:600;flex:1;min-width:0;text-align:right}

.progress{height:10px;border-radius:99px;background:var(--gray);overflow:hidden;margin:10px 0 7px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .4s var(--ease)}
.stamp-rail{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.stamp-cell{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
  display:grid;place-items:center;flex:none;position:relative
}
.stamp-cell [data-lucide]{width:15px;height:15px;color:var(--border)}
.stamp-cell.is-full{background:var(--yellow);border-color:var(--ink)}
.stamp-cell.is-full [data-lucide]{color:var(--ink)}
.stamp-cell.is-reward{box-shadow:0 0 0 3px var(--yellow-light)}
.stamp-cell__gift{
  position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  background:var(--ink);color:#fff;display:grid;place-items:center
}
.stamp-cell__gift [data-lucide]{width:9px;height:9px;color:#fff}

.timeline{display:grid;gap:0}
.timeline__row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.timeline__row:last-child{border-bottom:none}
.timeline__ico{width:30px;height:30px;border-radius:9px;background:var(--gray);display:grid;place-items:center;flex:none}
.timeline__ico [data-lucide]{width:15px;height:15px}
.timeline__txt{flex:1;min-width:0}
.timeline__txt b{display:block;font-size:14px;font-weight:600}
.timeline__txt span{display:block;font-size:12px;color:var(--ink-2)}
.timeline__amt{font-size:14px;font-weight:600;flex:none}

.section-label{
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  margin:22px 0 10px
}
.section-label:first-child{margin-top:0}

/* ============================================================
   Comptoir et Équipe
   ============================================================ */
.counter-away{
  max-width:520px;margin:48px auto;text-align:center;background:#fff;
  border:1px solid var(--border);border-radius:var(--r-card);padding:40px 32px
}
.counter-away__qr{
  width:92px;height:92px;margin:0 auto 24px;padding:8px;border-radius:12px;
  background:var(--yellow-light);box-shadow:inset 0 0 0 1px rgba(29,29,31,.12)
}
.counter-away h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-bottom:12px}
.counter-away p{font-size:14px;color:var(--ink-2);line-height:1.5}
.counter-away__who{
  display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:7px 14px 7px 7px;
  border-radius:var(--r-pill);background:var(--gray);font-size:13px;color:var(--ink)
}

.mock-ico{
  width:26px;height:26px;border-radius:50%;background:var(--gray);display:grid;place-items:center;flex:none
}
.mock-ico [data-lucide]{width:14px;height:14px;color:var(--ink-2);stroke-width:2.4}
.mock-ico.is-on{background:var(--yellow);box-shadow:inset 0 0 0 1px var(--ink)}
.mock-ico.is-on [data-lucide]{color:var(--ink)}

.role-card{display:flex;flex-direction:column;align-items:flex-start}
.role-card__top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.role-card__ico{
  width:34px;height:34px;border-radius:10px;background:var(--yellow);
  box-shadow:inset 0 0 0 1px var(--ink);display:grid;place-items:center;flex:none
}
.role-card__ico [data-lucide]{width:17px;height:17px}
.role-card__top b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.role-card p{font-size:13px;color:var(--ink-2);line-height:1.45}
.role-card__no{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--border);display:grid;gap:7px;width:100%}
.role-card__no li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.role-card__no [data-lucide]{width:13px;height:13px;flex:none;margin-top:2px}
.role-card__no--all li{color:var(--ink);font-weight:500}
.role-card__no--all [data-lucide]{color:var(--success)}

/* Résumé des droits d'un rôle, en lecture seule (fiche membre) */
.cap-summary{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cap-summary li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.4}
.cap-summary [data-lucide]{width:14px;height:14px;flex:none;margin-top:2px;color:var(--success)}
.cap-summary li.is-off{color:var(--ink-2)}
.cap-summary li.is-off [data-lucide]{color:#C7C7CC}

/* En-tête du rôle en cours de réglage (Paramètres) */
.role-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.role-head>div{flex:1;min-width:0}
.role-head b{display:block;font-size:16px;font-weight:600}
.role-head p{font-size:13px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.seg--wrap{flex-wrap:wrap}

/* Réglage imposé, présenté comme tel plutôt qu'en liste à un seul choix */
.fixed-row{
  display:flex;align-items:flex-start;gap:12px;background:var(--gray);
  border-radius:14px;padding:14px 16px
}
.fixed-row__ico{
  width:34px;height:34px;border-radius:10px;background:var(--yellow);
  box-shadow:inset 0 0 0 1px var(--ink);display:grid;place-items:center;flex:none
}
.fixed-row__ico [data-lucide]{width:17px;height:17px}
.fixed-row b{display:block;font-size:14px;font-weight:600}
.fixed-row p{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}

/* Encart « pris en charge par l'équipe » */
.managed-note{
  display:flex;align-items:flex-start;gap:16px;background:var(--yellow-light);
  border:1px solid rgba(29,29,31,.12);border-radius:var(--r-card);padding:18px 20px;margin-bottom:28px
}
.managed-note__ico{
  width:38px;height:38px;border-radius:11px;background:var(--yellow);
  box-shadow:inset 0 0 0 1px var(--ink);display:grid;place-items:center;flex:none
}
.managed-note__ico [data-lucide]{width:19px;height:19px}
.managed-note>div{flex:1;min-width:0}
.managed-note b{display:block;font-size:15px;font-weight:600}
.managed-note p{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:4px;max-width:70ch}
.managed-note .btn{flex:none;align-self:center}

.check-list{display:grid;gap:8px}
.check-row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);
  border-radius:13px;background:#fff;cursor:pointer;transition:border-color .18s
}
.check-row:hover{border-color:var(--ink)}
.check-row input{width:18px;height:18px;accent-color:var(--ink);flex:none;cursor:pointer}
.check-row input:disabled{cursor:not-allowed}
.check-row__txt{min-width:0;flex:1}
.check-row__txt b{display:block;font-size:14px;font-weight:600}
.check-row__txt span{display:block;font-size:12px;color:var(--ink-2)}

.cap-group{margin-bottom:18px}
.cap-group__title{
  font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:8px
}
.cap-row{
  display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)
}
.cap-row:last-child{border-bottom:none}
.cap-row__txt{flex:1;min-width:0}
.cap-row__txt b{display:block;font-size:14px;font-weight:600;line-height:1.35}
/* :not(.pill) : les pastilles voisines doivent garder leur largeur propre. */
.cap-row__txt>span:not(.pill){display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.cap-row.is-locked .cap-row__txt b{color:var(--ink-2)}
.switch[disabled]{opacity:.45;cursor:not-allowed}

/* ============================================================
   5.3 Scanner
   ============================================================ */
.scanner{
  position:fixed;inset:0;z-index:120;background:#000;color:#fff;display:none;
  flex-direction:column;overflow:hidden
}
.scanner.is-open{display:flex}
.scanner__feed{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 35%,#2a2a2e 0%,#0b0b0d 72%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 4px)
}
.scanner__inner{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:16px}
.scanner__top{display:flex;align-items:center;gap:10px;flex:none;padding-top:env(safe-area-inset-top)}
.scanner__top h2{
  font-size:16px;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.scanner .icon-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.scanner .icon-btn:hover{background:rgba(255,255,255,.2)}
.scanner__stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.viewfinder{width:min(74vw,260px);aspect-ratio:1;position:relative}
.viewfinder__corner{position:absolute;width:34px;height:34px;border:3px solid var(--yellow);border-radius:6px}
.viewfinder__corner:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
.viewfinder__corner:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
.viewfinder__corner:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
.viewfinder__corner:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}
.viewfinder__line{
  position:absolute;left:8px;right:8px;height:2px;background:var(--yellow);
  box-shadow:0 0 14px 2px rgba(255,247,92,.7);animation:sweep 2.4s var(--ease) infinite
}
@keyframes sweep{0%,100%{top:10%}50%{top:90%}}
.scanner__hint{font-size:13px;color:rgba(255,255,255,.7);text-align:center;max-width:30ch}
.scanner__foot{flex:none;display:grid;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.scanner__offline{
  display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);
  border-radius:14px;padding:11px 13px;font-size:13px
}
.scanner__offline [data-lucide]{width:17px;height:17px;flex:none}
.scanner__offline span{flex:1}
.scanner__link{
  background:none;border:none;color:rgba(255,255,255,.75);font-size:13px;
  text-decoration:underline;cursor:pointer;padding:6px
}

.scan-sheet{
  background:#fff;color:var(--ink);border-radius:22px;padding:20px;width:100%;
  max-width:420px;margin:0 auto;animation:sheetUp .3s var(--ease)
}
@keyframes sheetUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.scan-sheet__who{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.scan-sheet__txt{min-width:0}
.scan-sheet__txt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.scan-sheet__txt span{display:block;font-size:13px;color:var(--ink-2)}
.reward-banner{
  display:flex;align-items:center;gap:10px;background:var(--yellow);border:1px solid var(--ink);
  border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:600
}
.reward-banner [data-lucide]{width:18px;height:18px;flex:none}

/* Choix « créditer ou utiliser », posé avant toute action */
.scan-ask{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;color:var(--ink-2);margin:4px 0 14px;text-align:center
}
.scan-ask [data-lucide]{width:16px;height:16px}
.scan-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-choice__btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 12px;
  border:1.5px solid var(--border);border-radius:18px;background:#fff;cursor:pointer;
  text-align:center;transition:border-color .18s,transform .12s var(--ease)
}
.scan-choice__btn:active{transform:scale(.97)}
.scan-choice__btn:hover:not([disabled]){border-color:var(--ink)}
.scan-choice__btn[disabled]{opacity:.42;cursor:not-allowed}
.scan-choice__ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.scan-choice__ico [data-lucide]{width:23px;height:23px;stroke-width:2.2}
.scan-choice__ico--add{background:var(--yellow);box-shadow:inset 0 0 0 1.5px var(--ink)}
.scan-choice__ico--use{background:var(--ink);color:#fff}
.scan-choice__btn b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.scan-choice__btn>span:last-child{font-size:11.5px;color:var(--ink-2);line-height:1.35}

.redeem-list{display:grid;gap:8px}
.redeem-opt{
  display:flex;align-items:center;gap:11px;width:100%;padding:13px;cursor:pointer;
  border:1px solid var(--border);border-radius:15px;background:#fff;text-align:left;
  transition:border-color .18s
}
.redeem-opt:hover{border-color:var(--ink)}
.redeem-opt__txt{flex:1;min-width:0}
.redeem-opt__txt b{display:block;font-size:15px;font-weight:600}
.redeem-opt__txt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.redeem-opt>[data-lucide]{width:18px;height:18px;color:var(--ink-2);flex:none}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.keypad button{
  height:52px;border:1px solid var(--border);border-radius:14px;background:#fff;
  font-size:21px;font-weight:600;cursor:pointer;transition:background .12s
}
.keypad button:active{background:var(--gray)}
.amount-display{
  text-align:center;padding:14px;background:var(--gray);border-radius:16px
}
.amount-display b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.amount-display span{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
.scan-done{text-align:center;padding:8px 0}
.scan-done__check{
  width:72px;height:72px;border-radius:50%;background:var(--success);margin:0 auto 16px;
  display:grid;place-items:center;animation:pop .4s var(--ease)
}
.scan-done__check [data-lucide]{width:38px;height:38px;color:#fff;stroke-width:3}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ============================================================
   5.4 Campagnes
   ============================================================ */
.steps-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.step-chip{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);
  cursor:pointer;transition:background .18s,color .18s,border-color .18s
}
.step-chip b{
  width:19px;height:19px;border-radius:50%;background:var(--gray);display:grid;place-items:center;
  font-size:11px;flex:none
}
.step-chip.is-active{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.step-chip.is-active b{background:var(--ink);color:#fff}
.step-chip.is-done b{background:var(--success);color:#fff}
.step-chip[disabled]{opacity:.5;cursor:not-allowed}

.wizard{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.radio-list{display:grid;gap:8px}
.radio-opt{
  display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--border);
  border-radius:14px;background:#fff;cursor:pointer;text-align:left;
  transition:border-color .18s,background .18s
}
.radio-opt[disabled]{opacity:.55;cursor:not-allowed}
.radio-opt:hover:not([disabled]){background:var(--gray)}
.radio-opt.is-sel{border-color:var(--ink);background:var(--yellow-light)}
.radio-opt__mark{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border);flex:none;margin-top:1px;
  display:grid;place-items:center
}
.radio-opt.is-sel .radio-opt__mark{border-color:var(--ink);background:var(--ink)}
.radio-opt.is-sel .radio-opt__mark::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.radio-opt__txt{flex:1;min-width:0}
.radio-opt__txt b{display:block;font-size:14px;font-weight:600}
.radio-opt__txt span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.radio-opt__right{font-size:13px;font-weight:600;color:var(--ink-2);flex:none}

.preview-pane{position:sticky;top:20px;display:grid;gap:14px;justify-items:center}
.counter{font-size:12px;color:var(--ink-2);text-align:right}
.counter.is-over{color:var(--error);font-weight:600}

/* Téléphone (aperçu) */
.phone{
  width:258px;border-radius:38px;background:var(--ink);padding:9px;flex:none;
  box-shadow:0 24px 50px -22px rgba(0,0,0,.45)
}
.phone__screen{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:9/19;background:#fff}
.phone__notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:68px;height:20px;border-radius:12px;background:var(--ink);z-index:5}
.lockscreen{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:52px 12px 0;color:#fff
}
.lockscreen--android{background:linear-gradient(170deg,#1f2933,#0d1117)}
.lockscreen--ios{background:linear-gradient(170deg,#3a3a46,#141418)}
.lockscreen__time{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.lockscreen--android .lockscreen__time{font-weight:400;font-size:52px}
.lockscreen__date{font-size:12px;opacity:.72;margin-top:5px}
.notif{
  width:100%;margin-top:26px;border-radius:16px;padding:11px;display:flex;gap:9px;text-align:left;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.lockscreen--android .notif{background:rgba(255,255,255,.92);color:var(--ink);border-color:transparent;border-radius:22px}
.notif__ico{
  width:30px;height:30px;border-radius:9px;background:var(--yellow);color:var(--ink);
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none
}
.lockscreen--android .notif__ico{border-radius:50%}
.notif__t{font-size:12.5px;font-weight:600;line-height:1.3;word-break:break-word}
.notif__b{font-size:11.5px;opacity:.85;line-height:1.35;margin-top:2px;word-break:break-word}
.notif__m{font-size:10.5px;opacity:.6;margin-top:4px}

/* Automatisations */
.rule{
  background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px
}
.rule__top{display:flex;align-items:flex-start;gap:12px}
.rule__ico{width:36px;height:36px;border-radius:11px;background:var(--gray);display:grid;place-items:center;flex:none}
.rule__ico [data-lucide]{width:18px;height:18px;stroke-width:1.8}
.rule__txt{flex:1;min-width:0}
.rule__txt b{display:block;font-size:15px;font-weight:600}
.rule__txt p{font-size:13px;color:var(--ink-2);margin-top:3px}
.rule__txt b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rule__chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.check-list--inline{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.auto-recap{
  width:100%;max-width:260px;background:var(--gray);border-radius:14px;padding:14px;text-align:center
}
.auto-recap p{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600}
.auto-recap [data-lucide]{width:15px;height:15px;flex:none}
.auto-recap .caption{display:block;font-size:12px;font-weight:400;color:var(--ink-2);margin-top:5px;line-height:1.4}
.rule__body{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:grid;gap:12px}
.rule__stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.rule__stats b{color:var(--ink);font-weight:600}

/* ============================================================
   5.5 Mes cartes
   ============================================================ */
.prog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prog-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--r-card);padding:16px;
  display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;
  transition:border-color .18s,transform .18s var(--ease)
}
.prog-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.prog-card__foot{display:flex;align-items:center;gap:9px;margin-top:auto}
.prog-card__foot .prog-card__txt{flex:1;min-width:0}
.prog-card__txt b{display:block;font-size:15px;font-weight:600}
.prog-card__txt span{display:block;font-size:12px;color:var(--ink-2)}

/* Carte Wallet dessinée en CSS */
.wcard{border-radius:16px;padding:15px;color:#fff;position:relative;overflow:hidden}
.wcard--tall{min-height:190px;display:flex;flex-direction:column}
.wcard__top{display:flex;align-items:center;gap:10px}
.wcard__logo{
  width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.92);
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;overflow:hidden
}
.wcard__logo img{width:100%;height:100%;object-fit:cover}
.wcard__name{font-size:14px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.wcard__prog{font-size:11px;opacity:.75;line-height:1.2;margin-top:2px}
.wcard__banner{height:52px;border-radius:10px;margin-top:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:11px;opacity:.8}
.wcard__body{margin-top:14px}
.wcard__label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;opacity:.7}
.wcard__value{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.wcard__stamps{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.wstamp{
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1.5px solid rgba(255,255,255,.5)
}
.wstamp--dashed{border-style:dashed}
.wstamp [data-lucide]{width:11px;height:11px;opacity:.45}
.wstamp.is-full{background:rgba(255,255,255,.95);border-color:transparent}
.wstamp.is-full [data-lucide]{opacity:1;color:#1D1D1F}
.wcard__bar{height:6px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:12px;overflow:hidden}
.wcard__bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s var(--ease)}
.wcard__foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:10.5px;opacity:.82}
.wcard__code{background:#fff;border-radius:8px;padding:5px;margin:12px auto 0;width:66px;height:66px}
.wcard__back{font-size:11px;line-height:1.5;opacity:.85;white-space:pre-line;margin-top:12px}

.support-table .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.04em}

/* ============================================================
   Éditeur de carte (plein écran)
   ============================================================ */
.editor{
  position:fixed;inset:0;z-index:110;background:var(--gray);display:none;flex-direction:column
}
.editor.is-open{display:flex}
.editor__bar{
  display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;
  border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap
}
.editor__bar h2{font-size:16px;font-weight:600;flex:none}
.editor__bar .steps-head{margin:0;flex:1;justify-content:center}
.editor__bar .editor__actions{display:flex;gap:8px;margin-left:auto}
.editor__warn{
  display:flex;align-items:center;gap:10px;background:var(--yellow-light);
  border-bottom:1px solid rgba(29,29,31,.12);padding:10px 18px;font-size:13px;flex:none
}
.editor__warn [data-lucide]{width:17px;height:17px;flex:none}
.editor__body{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 400px;gap:0;min-height:0}
.editor__left{padding:24px;overflow:auto;max-width:720px;width:100%;margin:0 auto}
.editor__right{
  border-left:1px solid var(--border);background:#fff;padding:24px;overflow:auto;
  display:flex;flex-direction:column;align-items:center;gap:16px
}
.editor h3{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.editor__lead{font-size:14px;color:var(--ink-2);margin-bottom:20px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{
  border:1px solid var(--border);border-radius:18px;background:#fff;padding:22px;cursor:pointer;
  text-align:left;transition:border-color .18s,background .18s;position:relative
}
.tile:hover{border-color:var(--ink)}
.tile.is-sel{border-color:var(--ink);background:var(--yellow-light)}
.tile__art{height:84px;border-radius:12px;background:var(--gray);display:grid;place-items:center;margin-bottom:16px}
.tile.is-sel .tile__art{background:#fff}
.tile b{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.tile p{font-size:13px;color:var(--ink-2);line-height:1.45}
.tile[disabled]{opacity:.45;cursor:not-allowed}

.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tmpl{
  border:1px solid var(--border);border-radius:14px;background:#fff;padding:12px;cursor:pointer;
  text-align:center;transition:border-color .18s
}
.tmpl:hover{border-color:var(--ink)}
.tmpl.is-sel{border-color:var(--ink);background:var(--yellow-light)}
.tmpl__sw{height:34px;border-radius:9px;margin-bottom:9px;display:grid;place-items:center}
.tmpl__sw [data-lucide]{width:17px;height:17px;color:#fff}
.tmpl b{font-size:12.5px;font-weight:600}

.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.swatch{
  width:28px;height:28px;border-radius:9px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0
}
.swatch.is-sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.color-row{display:flex;align-items:center;gap:10px}
.color-row input[type=color]{
  width:40px;height:40px;padding:2px;border:1px solid var(--border);border-radius:11px;background:#fff;cursor:pointer
}
.contrast-warn{
  display:none;align-items:center;gap:8px;background:rgba(255,159,10,.14);color:#8a5200;
  border-radius:11px;padding:9px 12px;font-size:12.5px;margin-top:10px
}
.contrast-warn.is-on{display:flex}
.contrast-warn [data-lucide]{width:15px;height:15px;flex:none}

.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.icon-pick{
  aspect-ratio:1;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;
  display:grid;place-items:center;transition:border-color .18s
}
.icon-pick:hover{border-color:var(--ink)}
.icon-pick.is-sel{border-color:var(--ink);background:var(--yellow)}
.icon-pick [data-lucide]{width:19px;height:19px}

.rail{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.rail__cell{
  width:52px;height:52px;border-radius:14px;border:1.5px dashed var(--border);background:#fff;
  display:grid;place-items:center;cursor:pointer;position:relative;flex:none;
  font-size:12px;font-weight:600;color:var(--ink-2);transition:border-color .18s,background .18s
}
.rail__cell:hover{border-color:var(--ink)}
.rail__cell.has-reward{border-style:solid;border-color:var(--ink);background:var(--yellow)}
.rail__cell.is-last{box-shadow:0 0 0 3px var(--yellow-light)}
.rail__cell [data-lucide]{width:17px;height:17px}
.rail__cell small{position:absolute;bottom:3px;font-size:9px;opacity:.6;font-weight:600}

.reward-row{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:12px;margin-bottom:8px
}
.reward-row__ico{width:34px;height:34px;border-radius:10px;background:var(--yellow);box-shadow:inset 0 0 0 1px var(--ink);display:grid;place-items:center;flex:none}
.reward-row__ico [data-lucide]{width:17px;height:17px}
.reward-row__txt{flex:1;min-width:0}
.reward-row__txt b{display:block;font-size:14px;font-weight:600}
.reward-row__txt span{display:block;font-size:12px;color:var(--ink-2)}

.recap{display:grid;gap:1px;background:var(--border);border-radius:16px;overflow:hidden}
.recap__row{background:#fff;padding:13px 15px;display:flex;gap:12px;font-size:14px}
.recap__row span{color:var(--ink-2);width:40%;flex:none}
.recap__row b{font-weight:600;flex:1;text-align:right}

.preview-tabs{display:inline-flex;gap:3px;padding:3px;background:var(--gray);border-radius:var(--r-pill)}
.preview-tabs button{
  height:30px;padding:0 13px;border:none;border-radius:var(--r-pill);background:transparent;
  font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer
}
.preview-tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.preview-stage{width:100%;max-width:330px}
.sim-slider{width:100%;max-width:330px}
.sim-slider label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:7px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:var(--border);outline:none;margin:0;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--yellow);
  border:1px solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--yellow);border:1px solid var(--ink)
}

/* ============================================================
   Modale générique
   ============================================================ */
.modal{
  position:fixed;inset:0;z-index:130;display:none;align-items:center;justify-content:center;padding:18px
}
.modal.is-open{display:flex}
/* Le voile hérite de .sheet-backdrop (z-index 80) : sans cette remise à 1
   il passait au-dessus de la boîte, qui devenait sombre et inclicable. */
.modal>.sheet-backdrop{z-index:1}
.modal__box{
  background:#fff;border-radius:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;
  padding:24px;animation:sheetUp .28s var(--ease);position:relative;z-index:2
}
.modal__box h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.modal__lead{font-size:14px;color:var(--ink-2);margin-bottom:20px}
.modal__foot{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

/* ============================================================
   Responsive — sous 1024 px : barre d'onglets, pas de latérale
   ============================================================ */
@media (max-width:1023px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{
    display:flex;align-items:center;gap:10px;position:sticky;top:var(--banner-h);z-index:30;
    background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--border);padding:9px 14px
  }
  .topbar .shop-btn{border:none;background:transparent;padding:4px;width:auto}
  .topbar__logo{margin-left:auto}
  .view{padding:18px 14px 110px}
  .view__head h1{font-size:23px}
  .view__head .view__actions{margin-left:0;width:100%}
  .grid--kpi{grid-template-columns:1fr 1fr}
  .grid--main,.grid--2,.wizard{grid-template-columns:1fr}
  .grid--3{grid-template-columns:1fr}
  .prog-grid{grid-template-columns:1fr 1fr}
  .editor__body{grid-template-columns:1fr}
  .editor__right{border-left:none;border-top:1px solid var(--border);order:-1;padding:18px}
  .editor__bar{padding:10px 14px}
  /* flex:none annule le flex-basis:0 posé par la règle desktop,
     sinon width:100% reste sans effet. */
  .editor__bar .steps-head{
    order:3;flex:none;width:100%;justify-content:flex-start;flex-wrap:nowrap;
    overflow-x:auto;padding-bottom:2px
  }
  .editor__bar .step-chip{flex:none}
  .preview-pane{position:static}
  .panel{width:100vw;border-radius:0}

  .tabbar{
    display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
    position:fixed;left:0;right:0;bottom:0;z-index:50;height:66px;
    background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);
    overflow:visible
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:66px;border:none;background:none;cursor:pointer;color:var(--ink-2);font-size:10.5px;font-weight:600
  }
  .tab [data-lucide]{width:21px;height:21px;stroke-width:1.9}
  .tab.is-active{color:var(--ink)}

  /* Bouton Scanner : il doit se voir de loin, en caisse, à bout de bras.
     Rond jaune bien détaché, anneau blanc pour le découper de la barre,
     et ombre portée franche. */
  /* Le bouton reste dans le flux et déborde par une marge négative :
     plus prévisible qu'un positionnement absolu, dont le bloc
     conteneur dépendait du contexte de la barre. */
  .tab--scan{overflow:visible;justify-content:flex-start;gap:5px}
  .tab--scan .tab__fab{
    margin-top:-26px;width:64px;height:64px;border-radius:50%;flex:none;
    background:var(--yellow);border:2px solid var(--ink);
    display:grid;place-items:center;
    box-shadow:0 0 0 5px #fff, 0 10px 24px -4px rgba(29,29,31,.45);
    transition:transform .15s var(--ease)
  }
  .tab--scan:active .tab__fab{transform:scale(.94)}
  .tab--scan .tab__fab [data-lucide]{width:28px;height:28px;color:var(--ink);stroke-width:2.2}
  .tab--scan span{color:var(--ink);font-weight:700}
  .more-ico{
    width:30px;height:30px;border-radius:9px;background:var(--gray);
    display:grid;place-items:center;flex:none
  }
  .more-ico [data-lucide]{width:16px;height:16px}

  /* Le scan ne se fait qu'au comptoir, sur téléphone ou tablette. */
  .scan-hint{display:none}
}

@media (min-width:1024px){
  /* Le bouton Scanner n'existe pas en desktop. */
  .tab--scan,.scanner{display:none!important}
}

@media (max-width:719px){
  .grid--kpi{grid-template-columns:1fr 1fr}
  .prog-grid{grid-template-columns:1fr}
  .table-wrap{display:none}
  .cards-list{display:grid}
  /* Recherche sur toute la largeur, puis les filtres deux par deux. */
  .toolbar{display:grid;grid-template-columns:1fr 1fr}
  .toolbar .search{grid-column:1 / -1}
  .toolbar .select{width:100%;min-width:0}
  .toolbar>.btn{grid-column:1 / -1}
  .tiles{grid-template-columns:1fr}
  .modal{padding:0;align-items:flex-end}
  .modal__box{
    max-width:none;border-radius:22px 22px 0 0;max-height:92vh;
    /* Les boutons ne collent pas au bord, barre système comprise. */
    padding-bottom:calc(24px + env(safe-area-inset-bottom))
  }
  .donut-row{justify-content:center}
}
</style>
</head>
<body>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Bandeau démo permanent -->
<div class="demo-banner">
  <span class="demo-banner__dot" aria-hidden="true"></span>
  <span class="demo-banner__logo" data-logo="dark" aria-hidden="true"></span>
  <span class="demo-banner__txt">
    <span class="wide-only">Vous êtes sur le compte de démonstration · Données fictives</span>
    <span class="narrow-only">Démonstration · Données fictives</span>
  </span>
  <a class="btn btn--primary" href="index.html#tarifs">Créer mon compte</a>
</div>

<div class="app">
  <!-- Barre latérale (desktop ≥ 1024 px) -->
  <aside class="sidebar">
    <button class="shop-btn" id="shopBtnDesktop" aria-haspopup="listbox" aria-expanded="false"></button>
    <nav class="sidebar__nav" id="navDesktop" aria-label="Navigation du compte"></nav>
    <div class="sidebar__foot">
      <button class="nav-item" id="settingsBtn">
        <i data-lucide="settings" aria-hidden="true"></i> Paramètres
      </button>
      <button class="nav-item" id="logoutSide">
        <i data-lucide="log-out" aria-hidden="true"></i> Se déconnecter
      </button>
      <button class="sidebar__me" id="meBtnDesktop" aria-haspopup="listbox" aria-expanded="false"></button>
    </div>
  </aside>

  <div class="main">
    <!-- Barre du haut (mobile et tablette) -->
    <header class="topbar">
      <button class="shop-btn" id="shopBtnMobile" aria-haspopup="listbox" aria-expanded="false"></button>
      <button class="topbar__me" id="meBtnMobile" aria-haspopup="listbox" aria-expanded="false"></button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- Barre d'onglets (mobile et tablette) -->
<nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>

<!-- Fonds et surcouches -->
<div class="sheet-backdrop" id="backdrop"></div>

<div class="shop-menu" id="shopMenu" role="dialog" aria-label="Choisir un établissement">
  <div class="search">
    <i data-lucide="search" aria-hidden="true"></i>
    <input class="input" id="shopSearch" type="search" placeholder="Rechercher un établissement" aria-label="Rechercher un établissement">
  </div>
  <div class="shop-menu__list" id="shopList" role="listbox" aria-label="Établissements"></div>
</div>

<div class="shop-menu" id="moreMenu" role="dialog" aria-label="Autres écrans">
  <p class="shop-menu__title">Autres écrans</p>
  <div class="shop-menu__list" id="moreList" role="listbox" aria-label="Autres écrans"></div>
</div>

<div class="shop-menu" id="userMenu" role="dialog" aria-label="Changer d’accès">
  <p class="shop-menu__title">Parcourir la démo avec un autre accès</p>
  <div class="shop-menu__list" id="userList" role="listbox" aria-label="Membres de l’équipe"></div>
  <p class="shop-menu__note">
    <i data-lucide="info" aria-hidden="true"></i>
    Dans le produit réel, chacun ouvre sa propre session. Ce sélecteur n’existe que pour la démonstration.
  </p>
  <button class="shop-menu__add shop-menu__out" id="logoutBtn">
    <i data-lucide="log-out" aria-hidden="true"></i> Se déconnecter
  </button>
</div>

<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Fiche client">
  <div class="panel__head">
    <h2 id="panelTitle">Fiche client</h2>
    <button class="icon-btn" id="panelClose" aria-label="Fermer la fiche"><i data-lucide="x"></i></button>
  </div>
  <div class="panel__body" id="panelBody"></div>
  <div class="panel__foot" id="panelFoot"></div>
</aside>

<section class="scanner" id="scanner" aria-label="Scanner une carte">
  <div class="scanner__feed" aria-hidden="true"></div>
  <div class="scanner__inner">
    <div class="scanner__top">
      <button class="icon-btn" id="scannerClose" aria-label="Fermer le scanner"><i data-lucide="x"></i></button>
      <h2 id="scannerShop">Scanner</h2>
      <span class="pill pill--yellow" id="scannerQueue" hidden></span>
    </div>
    <div class="scanner__stage" id="scannerStage"></div>
    <div class="scanner__foot" id="scannerFoot"></div>
  </div>
</section>

<section class="editor" id="editor" aria-label="Éditeur de carte"></section>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet-backdrop is-open" id="modalBack" style="position:absolute"></div>
  <div class="modal__box" id="modalBox"></div>
</div>

<script src="https://unpkg.com/lucide@0.445.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ============================================================
   CONFIGURATION — un seul endroit à modifier
   ============================================================ */

/* Nom et logo provisoires. */
/* Déposez vos fichiers dans assets/marque/ en gardant ces noms, ou
   videz les deux champs pour revenir au carré jaune à lettre. */
const BRAND = {
  name: 'Backino',
  letter: 'B',
  logo: 'assets/marque/logo-sur-clair.svg',
  logoDark: 'assets/marque/logo-sur-fonce.svg'

/* Devise de la maquette. Le produit est multi-devise : chaque

/* Générateur pseudo-aléatoire à graine : la démo est identique
   d'une ouverture à l'autre, sans avoir à figer 150 fiches à la main. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const HISTORY_DAYS = 90;
const topRewardCost = prog => Math.max(...prog.rewards.map(r => r.cost || 0));

/* Construit les passages d'un client sur les 90 derniers jours.
   Au-delà, l'activité n'est pas détaillée : elle est résumée par un
   solde reporté, comme le ferait un vrai export limité dans le temps. */
function buildHistory(c, shop, joinedDays, inactive) {
  const prog = shop.program;
  const historyDays = Math.min(joinedDays, HISTORY_DAYS);
  const gap = between(5, 14);           // jours moyens entre deux passages
  const carryDays = joinedDays - historyDays;

  let balance = 0;
  if (carryDays > 0) {
    const prevVisits = Math.floor(carryDays / gap);
    balance = prog.type === 'stamps'
      ? prevVisits % prog.cells
      : Math.floor(prevVisits * (prog.minAmount + 45) / 2 * prog.pointsPerUnit) % (topRewardCost(prog) + 1);
    if (balance > 0) {
      c.txs.push({ date: new Date(Date.now() - historyDays * DAY), type: 'carry', qty: balance, employee: '—' });
    }
  } else if (prog.type === 'stamps' && prog.welcomeStamp) {
    balance = 1;
    c.txs.push({ date: c.joined, type: 'welcome', qty: 1, employee: '—' });
  } else if (prog.type === 'points' && prog.welcomePoints) {
    balance = prog.welcomePoints;
    c.txs.push({ date: c.joined, type: 'welcome', qty: prog.welcomePoints, employee: '—' });
  }

  /* Un client inactif n'a plus rien depuis au moins 31 jours. */
  const oldest = historyDays;
  const newest = inactive ? between(31, Math.max(32, historyDays - 5)) : 0;
  const span = Math.max(1, oldest - newest);
  const visits = Math.max(1, Math.round(span / gap));
  const dates = [];

  for (let i = 0; i < visits; i++) {
    let d, guard = 0;
    do {
      const offset = newest + Math.floor(rnd() * span);
      d = new Date(Date.now() - offset * DAY);
      d.setHours(between(9, 20), pick([0, 15, 30, 45]), 0, 0);
      guard++;
    } while (rnd() > DAY_WEIGHT[d.getDay()] / 1.8 && guard < 6);
    dates.push(d);
  }
  dates.sort((a, b) => a - b);

  for (const d of dates) {
    const employee = pick(staffOf(shop.id)).name;
    if (prog.type === 'stamps') {
      balance += 1;
      c.txs.push({ date: d, type: 'earn', qty: 1, employee });
      const reward = prog.rewards.find(r => r.cell === prog.cells);
      if (balance >= prog.cells) {
        if (rnd() < 0.62) {
          balance -= prog.cells;
          c.available = null;
          c.txs.push({ date: new Date(d.getTime() + 60000), type: 'redeem', qty: -prog.cells, label: reward.label, employee });
        } else {
          /* Carte pleine non utilisée : elle plafonne à la dernière case
             jusqu'à ce que le client vienne chercher sa récompense. */
          balance = prog.cells;
          c.available = reward.label;
        }
      }
    } else {
      const amount = between(prog.minAmount, 45);
      const gained = Math.floor(amount * prog.pointsPerUnit);
      balance += gained;
      c.txs.push({ date: d, type: 'earn', qty: gained, amount, employee });
      const affordable = [...prog.rewards].reverse().find(r => r.cost <= balance);
      if (affordable) {
        if (rnd() < 0.45) {
          balance -= affordable.cost;
          c.available = null;
          c.txs.push({ date: new Date(d.getTime() + 60000), type: 'redeem', qty: -affordable.cost, label: affordable.label, employee });
        } else {
          c.available = affordable.label;
        }
      }
    }
  }

  c.balance = balance;
  c.txs.reverse();
  c.lastVisit = dates.length ? dates[dates.length - 1] : c.joined;
}

/* Progression vers le prochain palier. */
function progressOf(c) {
  const prog = shopById(c.shopId).program;
  if (prog.type === 'stamps') {
    const target = prog.cells;
    return { current: c.balance, target, label: `${c.balance} / ${target} tampons`,
             next: prog.rewards[prog.rewards.length - 1].label, unit: 'tampons' };
  }
  const next = prog.rewards.find(r => r.cost > c.balance) || prog.rewards[prog.rewards.length - 1];
  return { current: c.balance, target: next.cost, label: `${num(c.balance)} ${prog.unit}`,
           next: next.label, unit: prog.unit };
}

}

/* ============================================================
   Faux QR code dessiné en CSS
   ============================================================ */
function qrHtml(seed = 7) {
  const N = 11;
  const corner = (r, c) => (r < 3 && c < 3) || (r < 3 && c > N - 4) || (r > N - 4 && c < 3);
  let html = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    let on;
    if (corner(r, c)) {
      const rr = r < 3 ? r : N - 1 - r, cc = c < 3 ? c : N - 1 - c;
      on = !(rr === 1 && cc === 1);
    } else {
      on = ((r * seed + c * 5 + (r * c) % 3) % 3) !== 0;
    }
    html += `<i class="${on ? 'on' : ''}"></i>`;
  }
  return `<div class="qr">${html}</div>`;
}

  .filter(([, r]) => can(r.cap) && !(r.mobileOnly && isDesktop()));

/* Écran d'arrivée : le tableau de bord pour qui a droit aux
   statistiques, sinon le premier écran autorisé. Un employé en desktop
   n'a aucun écran : on retombe sur le comptoir, qui lui explique que
   la caisse se tient depuis un téléphone ou une tablette. */
const homeRoute = () => can('dashboard.view') ? 'dashboard' : allowedRoutes()[0]?.[0] || 'comptoir';

const navDesktop = $('#navDesktop');
const tabbar = $('#tabbar');

function buildNav() {
  const routes = allowedRoutes();

  navDesktop.innerHTML = '';
  routes.filter(([, r]) => !r.foot).forEach(([key, r]) => {
    const b = el('button', 'nav-item', `<i data-lucide="${r.icon}" aria-hidden="true"></i> ${r.label}`);
    b.type = 'button';
    b.dataset.route = key;
    b.addEventListener('click', () => go(key));
    navDesktop.appendChild(b);
  });

  /* Le bouton Paramètres vit dans le pied de la barre latérale. */
  const settings = $('#settingsBtn');
  settings.hidden = !can('settings.view');
  settings.dataset.route = 'parametres';

  /* Les écrans réservés au super gérant restent visibles mais verrouillés :
     mieux vaut dire pourquoi un accès manque que de le faire disparaître. */
  Object.entries(ROUTES)
    .filter(([, r]) => SUPER_ONLY.includes(r.cap) && !can(r.cap) && !(r.mobileOnly && isDesktop()))
    .forEach(([, r]) => {
      const b = el('button', 'nav-item nav-item--locked',
        `<i data-lucide="${r.icon}" aria-hidden="true"></i> ${r.label}
         <i data-lucide="lock" class="nav-item__lock" aria-hidden="true"></i>`);
      b.type = 'button';
      b.title = `${r.label} — réservé au super gérant`;
      b.addEventListener('click', () =>
        toast(`${r.label} : réservé au super gérant`, 'lock'));
      navDesktop.appendChild(b);
    });

  /* Barre d'onglets : trois écrans directs autour du bouton Scanner,
     le reste derrière « Plus ». Sans ce dernier, les écrans au-delà du
     quatrième deviendraient inatteignables en mobile. */
  const tabbed = routes.filter(([, r]) => r.tab);
  const direct = tabbed.slice(0, 3);
  const overflow = tabbed.slice(3).concat(routes.filter(([, r]) => !r.tab));
  const withScan = can('scan.earn');

  tabbar.innerHTML = '';
  const addTab = ([key, r]) => {
    const b = el('button', 'tab', `<i data-lucide="${r.tabIcon}" aria-hidden="true"></i><span>${r.tab}</span>`);
    b.type = 'button';
    b.dataset.route = key;
    b.addEventListener('click', () => go(key));
    tabbar.appendChild(b);
  };

  direct.slice(0, 2).forEach(addTab);
  if (withScan) {
    const b = el('button', 'tab tab--scan',
      `<span class="tab__fab"><i data-lucide="scan-line" aria-hidden="true"></i></span><span>Scanner</span>`);
    b.type = 'button';
    b.dataset.route = '__scan';
    b.setAttribute('aria-label', 'Ouvrir le scanner');
    b.addEventListener('click', openScanner);
    tabbar.appendChild(b);
  }
  direct.slice(2).forEach(addTab);

  if (overflow.length) {
    const b = el('button', 'tab tab--more',
      `<i data-lucide="menu" aria-hidden="true"></i><span>Plus</span>`);
    b.type = 'button';
    b.setAttribute('aria-haspopup', 'listbox');
    b.setAttribute('aria-expanded', 'false');
    b.addEventListener('click', e => openMoreMenu(e.currentTarget, overflow));
    tabbar.appendChild(b);
  }

  tabbar.style.gridTemplateColumns =
    `repeat(${direct.length + (withScan ? 1 : 0) + (overflow.length ? 1 : 0)},1fr)`;
  icons();
}

function syncNav() {
  $$('.nav-item[data-route], #settingsBtn').forEach(b => b.classList.toggle('is-active', b.dataset.route === STATE.route));
  $$('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.route === STATE.route));
}

function go(route, { replace = false } = {}) {
  if (!ROUTES[route] || !can(ROUTES[route].cap)) route = homeRoute();
  STATE.route = route;
  const hash = '#' + route;
  if (location.hash !== hash) {
    replace ? history.replaceState(null, '', hash) : history.pushState(null, '', hash);
  }
  render();
  /* scrollIntoView passerait sous la barre collante en mobile. */
  scrollTo({ top: 0, behavior: 'instant' });
}

function render() {
  const view = $('#view');
  view.innerHTML = '';
  if (!can(ROUTES[STATE.route]?.cap)) STATE.route = homeRoute();
  ROUTES[STATE.route].render();
  syncNav();
  icons();
}

function openFloatingMenu(menu, anchor) {
  shopMenuAnchor = anchor;
  menu.classList.add('is-open');
  backdrop.classList.add('is-open');
  anchor.setAttribute('aria-expanded', 'true');

  if (matchMedia('(min-width:1024px)').matches) {
    const r = anchor.getBoundingClientRect();
    const width = 320;
    menu.style.inset = '';
    menu.style.width = width + 'px';
    menu.style.left = Math.min(r.left, innerWidth - width - 12) + 'px';
    menu.style.borderRadius = '18px';
    /* Le profil est en bas de la barre latérale : le menu s'ouvre au-dessus. */
    if (r.bottom + 320 > innerHeight) {
      menu.style.top = 'auto';
      menu.style.bottom = (innerHeight - r.top + 8) + 'px';
    } else {
      menu.style.bottom = 'auto';
      menu.style.top = (r.bottom + 8) + 'px';
    }
  } else {
    menu.style.inset = 'auto 0 0 0';
    menu.style.top = 'auto';
    menu.style.left = '0';
    menu.style.width = '100%';
    menu.style.borderRadius = '22px 22px 0 0';
  }
}

  closeMenus(); closePanel(); closeModal();
});

/* ---------- Sélecteur d'accès (dispositif de démonstration) ---------- */
function roleBadge(m) {
  const r = roleOf(m);
  return `<span class="pill ${r.cls}"><i data-lucide="${r.icon}"></i>${r.label}</span>`;
}

function scopeLabel(m) {
  if (roleOf(m).allShops) return 'Tous les établissements';
  const names = m.shops.map(id => shopById(id)?.name).filter(Boolean);
  return names.length ? names.join(' · ') : 'Aucun établissement';
}

function syncMeButtons() {
  const m = me(), r = roleOf(m);
  $('#meBtnDesktop').innerHTML = `
    <span class="avatar" aria-hidden="true">${initials(m.name)}</span>
    <span class="sidebar__me__txt"><b>${esc(m.name)}</b><span>${r.label}</span></span>
    <i data-lucide="chevrons-up-down" aria-hidden="true"></i>`;
  $('#meBtnMobile').innerHTML = `
    <span class="avatar avatar--sm" aria-hidden="true">${initials(m.name)}</span>
    <b>${r.short}</b>
    <i data-lucide="chevrons-up-down" aria-hidden="true"></i>`;
  $('#meBtnMobile').setAttribute('aria-label', `Accès en cours : ${m.name}, ${r.label}`);
}

function renderUserList() {
  const list = $('#userList');
  list.innerHTML = '';
  TEAM.filter(m => m.active).forEach(m => {
    const sel = m.id === STATE.userId;
    const b = el('button', 'shop-opt' + (sel ? ' is-active' : ''), `
      <span class="avatar avatar--sm ${sel ? '' : 'avatar--gray'}" aria-hidden="true">${initials(m.name)}</span>
      <span class="shop-opt__txt"><b>${esc(m.name)}</b><span>${roleOf(m).label} · ${esc(scopeLabel(m))}</span></span>
      ${sel ? '<i data-lucide="check" aria-hidden="true"></i>' : ''}`);
    b.type = 'button';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', String(sel));
    b.addEventListener('click', () => { setUser(m.id); closeMenus(); });
    list.appendChild(b);
  });
  icons();
}

function openUserMenu(anchor) {
  renderUserList();
  openFloatingMenu(userMenu, anchor);
}
$('#meBtnDesktop').addEventListener('click', e => openUserMenu(e.currentTarget));
$('#meBtnMobile').addEventListener('click', e => openUserMenu(e.currentTarget));

/* Changer d'accès recalcule la navigation, le périmètre et l'écran. */
function setUser(id) {
  if (STATE.userId === id) return;
  STATE.userId = id;
  store.set('demo.user', id);
  clampShop();
  store.set('demo.shop', STATE.shopId);
  syncMeButtons();
  syncShopButtons();
  buildNav();
  go(can(ROUTES[STATE.route]?.cap) ? STATE.route : homeRoute(), { replace: true });
  const m = me();
  toast(`Vous parcourez la démo en ${roleOf(m).label.toLowerCase()} · ${m.name}`, roleOf(m).icon);
}

/* Changer d'établissement recalcule toutes les vues. */
function setShop(id) {
  if (STATE.shopId === id) return;
  STATE.shopId = id;
  store.set('demo.shop', id);
  syncShopButtons();

  const view = $('#view');
  view.classList.add('is-swapping');
  setTimeout(() => {
    render();
    view.classList.remove('is-swapping');
    toast(`Vous êtes sur ${shopLabel()}`, 'store');
  }, 160);
}

/* ---------- Panneau latéral ---------- */
function openPanel(title, bodyHtml, footHtml = '') {
  $('#panelTitle').textContent = title;
  $('#panelBody').innerHTML = bodyHtml;
  $('#panelFoot').innerHTML = footHtml;
  $('#panel').classList.add('is-open');
  backdrop.classList.add('is-open');
  icons();
}
function closePanel() {
  $('#panel').classList.remove('is-open');
  if (!shopMenu.classList.contains('is-open')) backdrop.classList.remove('is-open');
}
$('#panelClose').addEventListener('click', closePanel);

/* ---------- Modale ---------- */
function openModal(html) {
  $('#modalBox').innerHTML = html;
  $('#modal').classList.add('is-open');
  icons();
}
function closeModal() { $('#modal').classList.remove('is-open'); }
$('#modalBack').addEventListener('click', closeModal);
