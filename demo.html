/* ---------- Contraste (WCAG) ---------- */
function hexToRgb(h) {
  const m = h.replace('#', '');
  const v = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16));
}
function luminance(hex) {
  return hexToRgb(hex).map(v => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  }).reduce((a, c, i) => a + c * [0.2126, 0.7152, 0.0722][i], 0);
}
function contrastRatio(a, b) {
  const la = luminance(a), lb = luminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

/* ---------- Contrôles de saisie ---------- */
function validateRewards(cfg) {
  const e = {};
  if (!cfg.rewards.length) {
    e.rewards = 'Au moins une récompense est nécessaire pour publier la carte.';
    return e;
  }
  if (cfg.type === 'stamps') {
    const cells = cfg.rewards.map(r => r.cell);
    if (new Set(cells).size !== cells.length) e.rewards = 'Deux récompenses ne peuvent pas être placées sur la même case.';
    else if (!cells.includes(cfg.cells)) e.rewards = `Le dernier palier doit être placé sur la case ${cfg.cells}, la dernière de la carte.`;
  } else {
    const costs = cfg.rewards.map(r => r.cost);
    if (costs.some(c => !Number.isInteger(c) || c <= 0)) e.rewards = 'Les coûts en points doivent être des nombres entiers positifs.';
    else if (new Set(costs).size !== costs.length) e.rewards = 'Deux récompenses ne peuvent pas avoir le même coût en points.';
  }
  return e;
}

function validateStep(step) {
  const cfg = EDIT.cfg, e = {};
  if (step === 1 && !cfg.type) e.type = 'Choisissez un type de carte pour continuer.';
  if (step === 2) {
    if (!cfg.programName.trim()) e.programName = 'Donnez un nom à votre programme.';
    if (!cfg.shopName.trim()) e.shopName = 'Le nom affiché sur la carte est obligatoire.';
  }
  if (step === 3) Object.assign(e, validateRewards(cfg));
  return e;
}

        </div>
        <div class="preview-stage" id="edPreview"></div>
        <div class="sim-slider" id="edSim"></div>
      </div>
    </div>`;

  $('#edLeft').innerHTML = editorStepHtml();
  renderPreview();
  bindEditor();
  icons();
}

function simMax() {
  const cfg = EDIT.cfg;
  return cfg.type === 'stamps' ? cfg.cells : Math.max(1, maxCost(cfg));
}

function renderPreview() {
  const cfg = EDIT.cfg;
  if (!cfg.type) {
    $('#edPreview').innerHTML = `<div class="empty" style="background:var(--gray);border-radius:18px">
      <i data-lucide="credit-card"></i>Choisissez un type de carte pour voir l’aperçu.</div>`;
    $('#edSim').innerHTML = '';
    icons();
    return;
  }
  const max = simMax();
  if (EDIT.preview.sim == null) EDIT.preview.sim = Math.round(max * .6);
  EDIT.preview.sim = Math.min(EDIT.preview.sim, max);

  $('#edPreview').innerHTML = walletCardHtml(cfg, { ...EDIT.preview, balance: EDIT.preview.sim });
  $('#edSim').innerHTML = `
    <label for="simRange">
      <span>Simuler un client</span>
      <span>${cfg.type === 'stamps' ? EDIT.preview.sim + ' / ' + cfg.cells + ' tampons' : num(EDIT.preview.sim) + ' ' + esc(cfg.unit)}</span>
    </label>
    <input type="range" id="simRange" min="0" max="${max}" step="${cfg.type === 'stamps' ? 1 : Math.max(1, Math.round(max / 60))}" value="${EDIT.preview.sim}">`;
  $('#simRange').addEventListener('input', e => { EDIT.preview.sim = +e.target.value; renderPreview(); });
  icons();
}

function errHtml(key) {
  return EDIT.errors[key] ? `<p class="field__err" style="display:block">${EDIT.errors[key]}</p>` : '';
}

function editorStepHtml() {
  const cfg = EDIT.cfg;
  /* Le type d'une carte publiée ne change jamais. */
  const locked = true;

  /* ---------- 1. Type ---------- */
  if (EDIT.step === 1) return `
    <h3>Quel type de carte ?</h3>
    <p class="editor__lead">Ce choix détermine les étapes Design et Récompenses.</p>
    <div class="tiles">
      <button class="tile ${cfg.type === 'stamps' ? 'is-sel' : ''}" data-type="stamps" ${locked ? 'disabled title="Le type ne peut pas changer une fois la carte publiée : les soldes de vos clients ne seraient plus interprétables."' : ''}>
        <div class="tile__art">
          <div style="display:flex;gap:5px">
            ${Array.from({ length: 5 }, (_, i) => `<span class="stamp-cell ${i < 3 ? 'is-full' : ''}" style="width:26px;height:26px"><i data-lucide="star"></i></span>`).join('')}
          </div>
        </div>
        <b>Carte à tampons</b>
        <p>Un passage égale un tampon. La récompense tombe sur une case précise. Idéal quand le ticket varie peu.</p>
      </button>
      <button class="tile ${cfg.type === 'points' ? 'is-sel' : ''}" data-type="points" ${locked ? 'disabled title="Le type ne peut pas changer une fois la carte publiée : les soldes de vos clients ne seraient plus interprétables."' : ''}>
        <div class="tile__art">
          <div style="width:120px">
            <div style="font-size:19px;font-weight:700;text-align:center">1 240 pts</div>
            <div class="progress" style="margin-top:8px"><i style="width:72%"></i></div>
          </div>
        </div>
        <b>Carte à points</b>
        <p>Les points dépendent du montant dépensé. Un catalogue de récompenses, chacune avec son coût.</p>
      </button>
    </div>
    ${locked ? `<p class="field__hint" style="margin-top:14px"><i data-lucide="lock" style="width:13px;height:13px;vertical-align:-2px"></i>
      Le type ne peut plus être modifié : les soldes déjà acquis par vos clients ne seraient plus interprétables.</p>` : ''}
    ${errHtml('type')}`;

  /* ---------- 2. Design ---------- */
  if (EDIT.step === 2) {
    const ratio = contrastRatio(cfg.bg, cfg.text);
    return `
      <h3>L’allure de votre carte</h3>
      <p class="editor__lead">Partez d’un modèle, puis ajustez. L’aperçu à droite suit votre saisie.</p>

      <p class="section-label">Modèles de départ</p>
      <div class="tmpl-grid" style="margin-bottom:8px">
        ${TEMPLATES.filter(t => !t.type || t.type === cfg.type || t.id === 'blank').map(t => `
          <button class="tmpl ${EDIT.template === t.id ? 'is-sel' : ''}" data-tmpl="${t.id}">
            <span class="tmpl__sw" style="background:${t.bg}"><i data-lucide="${t.icon}"></i></span>
            <b>${t.label}</b>
          </button>`).join('')}
      </div>

      <p class="section-label">Identité</p>
      <div class="field${EDIT.errors.shopName ? ' is-err' : ''}">
        <label for="edShop">Nom affiché sur la carte</label>
        <input class="input" id="edShop" value="${esc(cfg.shopName)}" placeholder="Salon Belle Allure">
        <span class="field__err">${EDIT.errors.shopName || ''}</span>
      </div>
      <div class="field${EDIT.errors.programName ? ' is-err' : ''}">
        <label for="edProg">Nom du programme</label>
        <input class="input" id="edProg" value="${esc(cfg.programName)}" placeholder="Club Belle Allure">
        <span class="field__err">${EDIT.errors.programName || ''}</span>
      </div>
      <div class="field">
        <label>Logo</label>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="shop-logo shop-logo--lg" style="background:${cfg.bg}">${esc(cfg.logoLetter)}</span>
          <button class="btn btn--secondary" id="edLogo" type="button"><i data-lucide="crop"></i> Téléverser et recadrer</button>
        </div>
        <span class="field__hint">Recadrage carré, 512 × 512 px minimum. En attendant, la lettre est utilisée.</span>
      </div>

      <p class="section-label">Couleurs</p>
      <div class="grid grid--2">
        <div class="field">
          <label for="edBg">Fond de la carte</label>
          <div class="color-row"><input type="color" id="edBg" value="${cfg.bg}"><code>${cfg.bg}</code></div>
          <div class="swatches">
            ${COLOR_SUGGESTIONS.map(c => `<button class="swatch ${cfg.bg.toLowerCase() === c.toLowerCase() ? 'is-sel' : ''}" style="background:${c}" data-bg="${c}" aria-label="Fond ${c}"></button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label for="edText">Couleur du texte</label>
          <div class="color-row"><input type="color" id="edText" value="${cfg.text}"><code>${cfg.text}</code></div>
          <div class="swatches">
            ${['#FFFFFF','#1D1D1F','#FFF75C'].map(c => `<button class="swatch ${cfg.text.toLowerCase() === c.toLowerCase() ? 'is-sel' : ''}" style="background:${c}" data-text="${c}" aria-label="Texte ${c}"></button>`).join('')}
          </div>
        </div>
      </div>
      <div class="contrast-warn ${ratio < 4.5 ? 'is-on' : ''}">
        <i data-lucide="alert-triangle"></i>
        Contraste insuffisant entre le texte et le fond (${ratio.toFixed(1)}:1, minimum recommandé 4,5:1). Vos clients liront mal leur solde.
      </div>

      <p class="section-label">Image de bannière</p>
      <div class="field">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="switch" role="switch" id="edBanner" aria-checked="${cfg.banner}" aria-label="Afficher une bannière"></button>
          <span>Afficher une image sous le logo</span>
        </div>
        <span class="field__hint">Facultatif · format conseillé 1032 × 336 px.</span>
      </div>

      ${cfg.type === 'stamps' ? `
        <p class="section-label">Spécifique aux tampons</p>
        <div class="field">
          <label>Icône du tampon</label>
          <div class="icon-grid">
            ${STAMP_ICONS.map(i => `<button class="icon-pick ${cfg.stampIcon === i ? 'is-sel' : ''}" data-icon="${i}" aria-label="Icône ${i}"><i data-lucide="${i}"></i></button>`).join('')}
          </div>
          <button class="btn btn--secondary btn--sm" id="edIconUp" type="button" style="margin-top:10px"><i data-lucide="upload"></i> Téléverser une icône</button>
        </div>
        <div class="field">
          <label for="edCellStyle">Style de la case vide</label>
          <select class="select" id="edCellStyle" style="max-width:260px">
            <option value="outline"${cfg.cellStyle === 'outline' ? ' selected' : ''}>Contour plein</option>
            <option value="dashed"${cfg.cellStyle === 'dashed' ? ' selected' : ''}>Contour en pointillés</option>
          </select>
        </div>` : `
        <p class="section-label">Spécifique aux points</p>
        <div class="field">
          <label for="edUnit">Nom de l’unité</label>
          <input class="input" id="edUnit" value="${esc(cfg.unit)}" placeholder="points" style="max-width:260px">
          <span class="field__hint">Par exemple : points, étoiles, cauris…</span>
        </div>
        <div class="field">
          <div style="display:flex;align-items:center;gap:12px">
            <button class="switch" role="switch" id="edProgress" aria-checked="${cfg.showProgress}" aria-label="Barre de progression"></button>
            <span>Afficher une barre de progression vers la prochaine récompense</span>
          </div>
        </div>`}

      <p class="section-label">Code client</p>
      <div class="fixed-row">
        <span class="fixed-row__ico"><i data-lucide="qr-code" aria-hidden="true"></i></span>
        <div>
          <b>QR code</b>
          <p>Le client présente son QR code, votre équipe le scanne en caisse.
             C’est le seul format proposé : il se lit depuis un écran de téléphone, même rayé ou peu lumineux.</p>
        </div>
      </div>`;
  }

  /* ---------- 3. Récompenses ---------- */
  if (EDIT.step === 3) {
    if (cfg.type === 'stamps') {
      return `
        <h3>Vos paliers de récompenses</h3>
        <p class="editor__lead">Un tampon par passage. Cliquez sur une case du rail pour y poser une récompense.</p>

        <div class="field">
          <label for="edCells">Nombre de cases</label>
          <input type="range" id="edCells" min="5" max="20" value="${cfg.cells}">
          <span class="field__hint">${cfg.cells} cases · la carte repart à zéro après le dernier palier, l’excédent est reporté.</span>
        </div>

        <div class="rail">
          ${Array.from({ length: cfg.cells }, (_, i) => {
            const n = i + 1;
            const r = cfg.rewards.find(x => x.cell === n);
            return `<button class="rail__cell ${r ? 'has-reward' : ''} ${n === cfg.cells ? 'is-last' : ''}" data-cell="${n}"
                      aria-label="Case ${n}${r ? ' : ' + r.label : ''}">
                      ${r ? '<i data-lucide="gift"></i>' : n}
                      <small>${n}</small>
                    </button>`;
          }).join('')}
        </div>
        ${errHtml('rewards')}

        <div style="margin-top:16px">
          ${cfg.rewards.sort((a, b) => a.cell - b.cell).map(r => `
            <div class="reward-row">
              <span class="reward-row__ico"><i data-lucide="gift"></i></span>
              <span class="reward-row__txt">
                <b>Case ${r.cell} · ${esc(r.label)}</b>
                <span>${REWARD_KINDS.find(k => k.id === r.kind).label} · validité ${r.validity ? r.validity + ' jours' : 'illimitée'}</span>
              </span>
              <button class="icon-btn icon-btn--plain" data-edit-reward="${r.cell}" aria-label="Modifier"><i data-lucide="pencil"></i></button>
              <button class="icon-btn icon-btn--plain" data-del-reward="${r.cell}" aria-label="Supprimer"><i data-lucide="trash-2"></i></button>
            </div>`).join('')}
        </div>

        <p class="section-label">Options</p>
        <div class="field">
          <div style="display:flex;align-items:center;gap:12px">
            <button class="switch" role="switch" id="edWelcome" aria-checked="${cfg.welcomeStamp}" aria-label="Tampon de bienvenue"></button>
            <span>Offrir un tampon de bienvenue à l’inscription</span>
          </div>
        </div>
        <div class="field">
          <label for="edMaxPeriod">Limite de tampons</label>
          <select class="select" id="edMaxPeriod" style="max-width:300px">
            <option value="none"${cfg.maxPerPeriod === 'none' ? ' selected' : ''}>Aucune limite</option>
            <option value="hour"${cfg.maxPerPeriod === 'hour' ? ' selected' : ''}>1 tampon maximum par heure</option>
            <option value="day"${cfg.maxPerPeriod === 'day' ? ' selected' : ''}>1 tampon maximum par jour</option>
          </select>
        </div>`;
    }

    return `
      <h3>Votre catalogue de récompenses</h3>
      <p class="editor__lead">Les points sont déduits à l’utilisation, le reste du solde est conservé.</p>

      <div class="grid grid--2">
        <div class="field">
          <label for="edRate">Points gagnés</label>
          <div style="display:flex;align-items:center;gap:9px">
            <input class="input" id="edRate" type="number" min="1" step="1" value="${cfg.pointsPerUnit}" style="width:90px">
            <span style="font-size:14px;color:var(--ink-2)">${esc(cfg.unit)} par ${CURRENCY.code === 'EUR' ? 'euro' : CURRENCY.code} dépensé</span>
          </div>
          <span class="field__hint">Arrondi à l’inférieur.</span>
        </div>
        <div class="field">
          <label for="edMin">Montant minimum d’achat</label>
          <input class="input" id="edMin" type="number" min="0" step="1" value="${cfg.minAmount}" style="max-width:140px">
          <span class="field__hint">En dessous, aucun point n’est attribué.</span>
        </div>
      </div>

      <p class="section-label">Récompenses</p>
      ${cfg.rewards.sort((a, b) => a.cost - b.cost).map(r => `
        <div class="reward-row">
          <span class="reward-row__ico"><i data-lucide="gift"></i></span>
          <span class="reward-row__txt">
            <b>${num(r.cost)} ${esc(cfg.unit)} · ${esc(r.label)}</b>
            <span>${REWARD_KINDS.find(k => k.id === r.kind).label} · validité ${r.validity ? r.validity + ' jours' : 'illimitée'}${r.once ? ' · 1 fois par client' : ''}</span>
          </span>
          <button class="icon-btn icon-btn--plain" data-edit-reward="${r.id}" aria-label="Modifier"><i data-lucide="pencil"></i></button>
          <button class="icon-btn icon-btn--plain" data-del-reward="${r.id}" aria-label="Supprimer"><i data-lucide="trash-2"></i></button>
        </div>`).join('')}
      <button class="btn btn--secondary" id="edAddReward"><i data-lucide="plus"></i> Ajouter une récompense</button>
      ${errHtml('rewards')}

      <p class="section-label">Options</p>
      <div class="grid grid--2">
        <div class="field">
          <label for="edWelcomePts">Points de bienvenue</label>
          <input class="input" id="edWelcomePts" type="number" min="0" step="10" value="${cfg.welcomePoints}" style="max-width:140px">
        </div>
        <div class="field">
          <label for="edBirthday">Points bonus d’anniversaire</label>
          <input class="input" id="edBirthday" type="number" min="0" step="10" value="${cfg.birthdayPoints}" style="max-width:140px">
        </div>
      </div>
      <div class="field">
        <label for="edExpiry">Expiration des points</label>
        <select class="select" id="edExpiry" style="max-width:260px">
          <option value="0"${!cfg.expiry ? ' selected' : ''}>Aucune expiration</option>
          <option value="6"${cfg.expiry === 6 ? ' selected' : ''}>6 mois</option>
          <option value="12"${cfg.expiry === 12 ? ' selected' : ''}>12 mois</option>
        </select>
      </div>`;
  }

  /* ---------- 4. Informations ---------- */
  if (EDIT.step === 4) return `
    <h3>Le dos de la carte</h3>
    <p class="editor__lead">Ce texte figure au verso, dans le Wallet du client. Basculez l’aperçu sur « Verso » pour le voir.</p>
    <div class="field">
      <label for="edBack">Conditions du programme</label>
      <textarea class="textarea" id="edBack" style="min-height:150px" placeholder="Programme réservé aux clients de…">${esc(cfg.back)}</textarea>
      <span class="field__hint">Règles d’attribution, validité des récompenses, limites éventuelles.</span>
    </div>
    <div class="field">
      <label for="edContact">Contact affiché</label>
      <input class="input" id="edContact" value="${esc(cfg.contact)}" placeholder="contact@exemple.com">
      <span class="field__hint">Adresse ou numéro auquel le client peut vous joindre.</span>
    </div>`;

  /* ---------- 5. Publication ---------- */
  const errs = validateStep(3);
  return `
    <h3>Récapitulatif</h3>
    <p class="editor__lead">Vérifiez une dernière fois, puis publiez. La carte devient disponible à l’inscription.</p>
    <div class="recap">
      <div class="recap__row"><span>Établissement</span><b>${esc(cfg.shopName)}</b></div>
      <div class="recap__row"><span>Programme</span><b>${esc(cfg.programName) || '—'}</b></div>
      <div class="recap__row"><span>Type de carte</span><b>${cfg.type === 'stamps' ? 'Tampons' : 'Points'}</b></div>
      ${cfg.type === 'stamps'
        ? `<div class="recap__row"><span>Règle de gain</span><b>1 tampon par passage</b></div>
           <div class="recap__row"><span>Structure</span><b>${cfg.cells} cases</b></div>`
        : `<div class="recap__row"><span>Règle de gain</span><b>${cfg.pointsPerUnit} ${esc(cfg.unit)} par ${CURRENCY.code === 'EUR' ? 'euro' : CURRENCY.code}, minimum ${money(cfg.minAmount)}</b></div>`}
      <div class="recap__row"><span>Récompenses</span><b>${cfg.rewards.length}</b></div>
      <div class="recap__row"><span>Code client</span><b>QR code</b></div>
    </div>
    ${cfg.rewards.length ? `<div style="margin-top:16px">${cfg.rewards.map(r => `
      <div class="reward-row">
        <span class="reward-row__ico"><i data-lucide="gift"></i></span>
        <span class="reward-row__txt">
          <b>${cfg.type === 'stamps' ? 'Case ' + r.cell : num(r.cost) + ' ' + esc(cfg.unit)} · ${esc(r.label)}</b>
          <span>${REWARD_KINDS.find(k => k.id === r.kind).label} · validité ${r.validity ? r.validity + ' jours' : 'illimitée'}</span>
        </span>
      </div>`).join('')}</div>` : ''}
    ${errs.rewards ? `<p class="field__err" style="display:block;margin-top:14px">${errs.rewards}</p>` : ''}
    <button class="btn btn--primary btn--lg" id="edPublish" style="margin-top:22px" ${errs.rewards ? 'disabled' : ''}>
      <i data-lucide="rocket"></i> Enregistrer les modifications
    </button>`;
}

/* Redessine le volet gauche et l'aperçu sans reconstruire toute la fenêtre. */
function refreshEditor() {
  $('#edLeft').innerHTML = editorStepHtml();
  renderPreview();
  bindEditor();
  icons();
}

function bindEditor() {
  const cfg = EDIT.cfg;

  /* Barre du haut (présente une seule fois) */
  $('#edClose')?.addEventListener('click', () => {
    openModal(`
      <h2>Quitter l’éditeur ?</h2>
      <p class="modal__lead">Les réglages non enregistrés seront perdus.</p>
      <div class="modal__foot">
        <button class="btn btn--secondary" data-close>Continuer l’édition</button>
        <button class="btn btn--danger" id="edQuit">Quitter</button>
      </div>`);
    $('#edQuit').addEventListener('click', () => { closeModal(); closeEditor(); });
    $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  }, { once: true });

  $('#edDraft')?.addEventListener('click', () => {
    closeEditor();
    toast('Carte enregistrée en brouillon', 'save');
  }, { once: true });

  $$('[data-estep]').forEach(b => b.addEventListener('click', () => {
    const s = +b.dataset.estep;
    if (s > EDIT.maxStep) return;
    EDIT.step = s; EDIT.errors = {}; renderEditor();
  }));

  $$('[data-pv]').forEach(b => b.addEventListener('click', () => {
    EDIT.preview.variant = b.dataset.pv; renderEditor();
  }));
  $$('[data-side]').forEach(b => b.addEventListener('click', () => {
    EDIT.preview.side = b.dataset.side; renderEditor();
  }));

  /* ---------- Étape 1 ---------- */
  $$('[data-type]').forEach(b => b.addEventListener('click', () => {
    cfg.type = b.dataset.type;
    if (cfg.type === 'stamps' && cfg.rewards.some(r => r.cost != null)) cfg.rewards = [];
    if (cfg.type === 'points' && cfg.rewards.some(r => r.cell != null)) cfg.rewards = [];
    EDIT.preview.sim = null;
    EDIT.errors = {};
    refreshEditor();
  }));

  /* ---------- Étape 2 ---------- */
  $$('[data-tmpl]').forEach(b => b.addEventListener('click', () => {
    const t = TEMPLATES.find(x => x.id === b.dataset.tmpl);
    EDIT.template = t.id;
    cfg.bg = t.bg;
    cfg.text = '#FFFFFF';
    if (t.type) {
      cfg.type = t.type;
      if (t.type === 'stamps') {
        cfg.cells = t.cells; cfg.stampIcon = t.stampIcon;
        cfg.rewards = [{ id: 'r1', cell: t.cells, label: t.reward, kind: 'product', validity: 30 }];
      } else {
        cfg.unit = t.unit;
        cfg.rewards = t.rewards.map(([label, cost], i) => ({ id: 'r' + (i + 1), cost, label, kind: 'product', validity: 30 }));
      }
    }
    EDIT.preview.sim = null;
    refreshEditor();
  }));

  const live = (sel, fn) => {
    const n = $(sel);
    if (n) n.addEventListener('input', e => { fn(e.target.value); renderPreview(); });
  };
  live('#edShop', v => cfg.shopName = v);
  live('#edProg', v => cfg.programName = v);
  live('#edUnit', v => cfg.unit = v || 'points');
  live('#edBack', v => cfg.back = v);
  live('#edContact', v => cfg.contact = v);

  $('#edBg')?.addEventListener('input', e => { cfg.bg = e.target.value; EDIT.template = null; refreshEditor(); });
  $('#edText')?.addEventListener('input', e => { cfg.text = e.target.value; refreshEditor(); });
  $$('[data-bg]').forEach(b => b.addEventListener('click', () => { cfg.bg = b.dataset.bg; EDIT.template = null; refreshEditor(); }));
  $$('[data-text]').forEach(b => b.addEventListener('click', () => { cfg.text = b.dataset.text; refreshEditor(); }));
  $$('[data-icon]').forEach(b => b.addEventListener('click', () => { cfg.stampIcon = b.dataset.icon; refreshEditor(); }));

  $('#edBanner')?.addEventListener('click', () => { cfg.banner = !cfg.banner; refreshEditor(); });
  $('#edProgress')?.addEventListener('click', () => { cfg.showProgress = !cfg.showProgress; refreshEditor(); });
  $('#edWelcome')?.addEventListener('click', () => { cfg.welcomeStamp = !cfg.welcomeStamp; refreshEditor(); });
  $('#edCellStyle')?.addEventListener('change', e => { cfg.cellStyle = e.target.value; refreshEditor(); });
  $('#edLogo')?.addEventListener('click', () => toast('Téléversement et recadrage simulés', 'crop'));
  $('#edIconUp')?.addEventListener('click', () => toast('Téléversement d’icône simulé', 'upload'));

  /* ---------- Étape 3 ---------- */
  $('#edCells')?.addEventListener('input', e => {
    cfg.cells = +e.target.value;
    cfg.rewards = cfg.rewards.filter(r => r.cell <= cfg.cells);
    EDIT.preview.sim = null;
    refreshEditor();
  });
  $$('[data-cell]').forEach(b => b.addEventListener('click', () => openRewardModal(+b.dataset.cell)));
  $('#edAddReward')?.addEventListener('click', () => openRewardModal(null));
  $$('[data-edit-reward]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openRewardModal(cfg.type === 'stamps' ? +b.dataset.editReward : b.dataset.editReward);
  }));
  $$('[data-del-reward]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const key = b.dataset.delReward;
    cfg.rewards = cfg.type === 'stamps'
      ? cfg.rewards.filter(r => r.cell !== +key)
      : cfg.rewards.filter(r => r.id !== key);
    EDIT.errors = validateRewards(cfg);
    refreshEditor();
  }));

  $('#edRate')?.addEventListener('input', e => { cfg.pointsPerUnit = Math.max(1, +e.target.value || 1); renderPreview(); });
  $('#edMin')?.addEventListener('input', e => { cfg.minAmount = Math.max(0, +e.target.value || 0); });
  $('#edWelcomePts')?.addEventListener('input', e => { cfg.welcomePoints = Math.max(0, +e.target.value || 0); });
  $('#edBirthday')?.addEventListener('input', e => { cfg.birthdayPoints = Math.max(0, +e.target.value || 0); });
  $('#edExpiry')?.addEventListener('change', e => { cfg.expiry = +e.target.value; });
  $('#edMaxPeriod')?.addEventListener('change', e => { cfg.maxPerPeriod = e.target.value; });

  /* ---------- Étape 5 ---------- */
  $('#edPublish')?.addEventListener('click', publishCard);

  /* ---------- Navigation bas de page ---------- */
  if (!$('#edNav')) {
    const nav = el('div', '', `
      <div id="edNav" style="display:flex;gap:8px;margin-top:28px;flex-wrap:wrap">
        ${EDIT.step > 1 ? '<button class="btn btn--secondary" id="edPrev"><i data-lucide="arrow-left"></i> Retour</button>' : ''}
        ${EDIT.step < 5 ? '<button class="btn btn--primary" id="edNext">Continuer <i data-lucide="arrow-right"></i></button>' : ''}
      </div>`);
    $('#edLeft').appendChild(nav.firstElementChild);
    icons();
  }
  $('#edPrev')?.addEventListener('click', () => { EDIT.step--; EDIT.errors = {}; renderEditor(); });
  $('#edNext')?.addEventListener('click', () => {
    EDIT.errors = validateStep(EDIT.step);
    if (Object.keys(EDIT.errors).length) { refreshEditor(); return; }
    EDIT.step++;
    EDIT.maxStep = Math.max(EDIT.maxStep, EDIT.step);
    renderEditor();
  });
}

/* ---------- Ajouter / modifier une récompense ---------- */
function openRewardModal(key) {
  const cfg = EDIT.cfg;
  const stamps = cfg.type === 'stamps';
  const existing = stamps
    ? cfg.rewards.find(r => r.cell === key)
    : cfg.rewards.find(r => r.id === key);

  openModal(`
    <h2>${existing ? 'Modifier la récompense' : 'Nouvelle récompense'}</h2>
    <p class="modal__lead">${stamps ? `Case ${key} de la carte.` : 'Elle apparaîtra dans le catalogue du client.'}</p>
    <div class="field">
      <label for="rLabel">Libellé</label>
      <input class="input" id="rLabel" value="${existing ? esc(existing.label) : ''}" placeholder="${stamps ? 'Brushing offert' : 'Dessert offert'}">
      <span class="field__err">Le libellé est obligatoire.</span>
    </div>
    ${stamps ? '' : `
      <div class="field">
        <label for="rCost">Coût en ${esc(cfg.unit)}</label>
        <input class="input" id="rCost" type="number" min="1" step="1" value="${existing ? existing.cost : ''}" placeholder="500" style="max-width:160px">
        <span class="field__err">Un nombre entier positif, différent des autres récompenses.</span>
      </div>`}
    <div class="field">
      <label for="rKind">Type de récompense</label>
      <select class="select" id="rKind">
        ${REWARD_KINDS.map(k => `<option value="${k.id}"${existing && existing.kind === k.id ? ' selected' : ''}>${k.label}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label for="rValid">Validité après déblocage</label>
      <select class="select" id="rValid">
        ${VALIDITIES.map(([v, l]) => `<option value="${v}"${existing && existing.validity === v ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    ${stamps ? '' : `
      <div class="field">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="switch" role="switch" id="rOnce" aria-checked="${!!(existing && existing.once)}" aria-label="Limiter à une fois par client"></button>
          <span>Limiter à 1 fois par client</span>
        </div>
      </div>`}
    <div class="modal__foot">
      ${existing ? '<button class="btn btn--danger" id="rDelete">Supprimer</button>' : ''}
      <button class="btn btn--secondary" data-close>Annuler</button>
      <button class="btn btn--primary" id="rSave">${existing ? 'Enregistrer' : 'Ajouter'}</button>
    </div>`);

  let once = !!(existing && existing.once);
  $('#rOnce')?.addEventListener('click', e => {
    once = !once;
    e.currentTarget.setAttribute('aria-checked', String(once));
  });

  $('#rDelete')?.addEventListener('click', () => {
    cfg.rewards = stamps ? cfg.rewards.filter(r => r.cell !== key) : cfg.rewards.filter(r => r.id !== key);
    closeModal();
    EDIT.errors = validateRewards(cfg);
    refreshEditor();
  });

  $('#rSave').addEventListener('click', () => {
    const label = $('#rLabel').value.trim();
    let ok = true;
    $('#rLabel').closest('.field').classList.toggle('is-err', !label);
    if (!label) ok = false;

    let cost = null;
    if (!stamps) {
      cost = +$('#rCost').value;
      const dup = cfg.rewards.some(r => r.cost === cost && r.id !== key);
      const bad = !Number.isInteger(cost) || cost <= 0 || dup;
      $('#rCost').closest('.field').classList.toggle('is-err', bad);
      if (bad) ok = false;
    }
    if (!ok) return;

    const payload = {
      label, kind: $('#rKind').value, validity: +$('#rValid').value,
      ...(stamps ? { cell: key } : { cost, once })
    };

    if (existing) Object.assign(existing, payload);
    else cfg.rewards.push({ id: 'r' + Date.now(), ...payload });

    closeModal();
    EDIT.errors = validateRewards(cfg);
    EDIT.preview.sim = null;
    refreshEditor();
  });
  $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
}

/* ---------- Publication ---------- */
function publishCard() {
  const cfg = EDIT.cfg;
  const errs = { ...validateStep(2), ...validateRewards(cfg) };
  if (Object.keys(errs).length) {
    EDIT.errors = errs;
    EDIT.step = errs.rewards ? 3 : 2;
    renderEditor();
    return;
  }

  const target = shopById(cfg.shopId);
  if (target) {
    target.name = cfg.shopName;
    target.color = cfg.bg;
    target.textColor = cfg.text;
    target.letter = cfg.logoLetter;
    Object.assign(target.program, {
      name: cfg.programName, type: cfg.type, cells: cfg.cells, icon: cfg.stampIcon,
      cellStyle: cfg.cellStyle, unit: cfg.unit, pointsPerUnit: cfg.pointsPerUnit,
      minAmount: cfg.minAmount, showProgress: cfg.showProgress,
      welcomeStamp: cfg.welcomeStamp, welcomePoints: cfg.welcomePoints,
      birthdayPoints: cfg.birthdayPoints, expiry: cfg.expiry, maxPerPeriod: cfg.maxPerPeriod,
      rewards: cfg.rewards.map(r => ({ ...r })), back: cfg.back
    });
  }

  closeEditor();
  syncShopButtons();
  render();
  toast('Modifications enregistrées', 'rocket');
}

/* ============================================================
   Démarrage
   ============================================================ */
syncMeButtons();
syncShopButtons();
buildNav();
go(location.hash.slice(1) || homeRoute(), { replace: true });
icons();

/* Le passage desktop ↔ mobile change la nature du sélecteur et du scan. */
let wasDesktop = matchMedia('(min-width:1024px)').matches;
addEventListener('resize', () => {
  const now = matchMedia('(min-width:1024px)').matches;
  if (now === wasDesktop) return;
  wasDesktop = now;
  closeShopMenu();
  if (now) closeScanner();
  buildNav();
  /* Le comptoir disparaît en desktop : on bascule sur un écran autorisé. */
  const r = ROUTES[STATE.route];
  if (r && r.mobileOnly && now && allowedRoutes().length) go(homeRoute(), { replace: true });
  else { render(); }
});
</script>
</body>
</html>
